<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#181b22">
<title>Мессенджер</title>
<style>
  :root{--bg:#0f1115;--panel:#181b22;--line:#262a33;--text:#e8eaf0;--muted:#8b91a0;--accent:#4c8dff;--mine:#2b5fd9;--theirs:#232733}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,sans-serif}
  #app{height:100dvh;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  header b{flex:1;font-size:18px}
  button{font:inherit;border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:#fff;cursor:pointer}
  button:disabled{opacity:.6}
  button.icon{background:none;padding:4px 8px;font-size:22px;color:var(--text)}
  button.ghost{background:none;color:var(--muted);padding:6px 8px}
  button.danger{background:none;color:#ff6b6b}
  input,textarea{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
  textarea{resize:vertical}
  .auth{padding:24px 16px;display:flex;flex-direction:column;gap:12px;margin:auto 0}
  .auth h1{margin:0 0 8px}
  .err{color:#ff6b6b;min-height:1.4em;margin:0}
  .muted{color:var(--muted);padding:16px;margin:0}
  .label{color:var(--muted);font-size:13px;margin:4px 0 -6px}
  .list{flex:1;overflow:auto}
  .row{display:flex;align-items:center;gap:12px;width:100%;background:none;border-radius:0;border-bottom:1px solid var(--line);padding:12px 16px;text-align:left;color:var(--text)}
  .row small{display:block;color:var(--muted);font-size:13px}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:600;flex:none;overflow:hidden;color:#fff}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .avatar.sm{width:36px;height:36px;font-size:15px}
  .avatar.big{width:112px;height:112px;font-size:46px}
  .avbtn{background:none;padding:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--accent);font-size:14px}
  .peerhead{display:flex;align-items:center;gap:10px;background:none;padding:0;color:var(--text);font-weight:600;flex:1;text-align:left;font-size:18px}
  .profile{flex:1;overflow:auto;padding:24px 16px;display:flex;flex-direction:column;gap:12px}
  .profile .center{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
  .profile h2{margin:0}
  .bio{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}
  .msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
  .msg{max-width:80%;padding:8px 12px;border-radius:14px;overflow-wrap:anywhere;white-space:pre-wrap}
  .msg small{display:block;font-size:11px;opacity:.6;text-align:right;margin-top:2px}
  .mine{align-self:flex-end;background:var(--mine);border-bottom-right-radius:4px}
  .theirs{align-self:flex-start;background:var(--theirs);border-bottom-left-radius:4px}
  .composer{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
  .composer .gbtn{background:none;padding:0 6px;font-size:24px}
  .msg.gift{text-align:center;min-width:150px}
  .msg.gift .gemoji{font-size:56px;line-height:1.15;display:block}
  .msg.gift .gname{font-weight:600;display:block}
  .msg.gift .gcomment{display:block;margin-top:2px;opacity:.9}
  .stars{color:#ffc94d;font-weight:600}
  .balance{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--panel);border-radius:12px}
  .gifts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .gtile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:14px;background:var(--panel);border:2px solid transparent;color:var(--text)}
  .gtile.sel{border-color:var(--accent)}
  .gtile .gemoji{font-size:40px;line-height:1.15}
  .gtile .stars{font-size:14px}
  .owned{display:flex;flex-wrap:wrap;gap:8px}
  .owned span{font-size:30px;background:var(--panel);border-radius:12px;padding:6px 10px}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ====== НАСТРОЙКИ Supabase ======
const SUPABASE_URL = "https://tksunhdivinioytzvahq.supabase.co";
const SUPABASE_KEY = "sb_publishable_Y3R08qTEV94Mh4L1M8T01A_7bo6fhPs";
// ================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById("app");
let me = null;          // пользователь из Supabase Auth
let myProfile = null;   // моя строка из таблицы profiles
let channel = null;
let wallet = 0;          // баланс звёзд
let catalog = [];        // каталог подарков
const giftById = {};

// --- маленькие помощники ---
function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (k === "class") node.className = v;
    else node.setAttribute(k, v);
  }
  node.append(...children);
  return node;
}
function show(...nodes) { app.replaceChildren(...nodes); }
function closeChannel() {
  if (channel) { sb.removeChannel(channel); channel = null; }
}

// аватарка: фото, если есть, иначе первая буква ника
function avatar(p, size = "") {
  const box = el("div", { class: "avatar " + size });
  if (p.avatar_url) box.append(el("img", { src: p.avatar_url, alt: "" }));
  else box.textContent = (p.username || "?").slice(0, 1).toUpperCase();
  return box;
}

// обрезаем фото до квадрата и уменьшаем, чтобы загрузка была быстрой
function resizeToSquare(file, size = 256) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(img.width, img.height);
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = size;
      canvas.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url);
      canvas.toBlob((b) => (b ? resolve(b) : reject(new Error("Не удалось обработать фото"))), "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Не удалось открыть изображение")); };
    img.src = url;
  });
}

async function loadMyProfile() {
  const { data } = await sb.from("profiles").select("id, username, bio, avatar_url").eq("id", me.id).single();
  myProfile = data || { id: me.id, username: (me.email || "я").split("@")[0], bio: null, avatar_url: null };
}

async function loadWalletAndCatalog() {
  const [w, c] = await Promise.all([
    sb.from("wallets").select("stars").eq("user_id", me.id).maybeSingle(),
    sb.from("gift_catalog").select("id, emoji, name, price").order("sort"),
  ]);
  wallet = w.data?.stars ?? 0;
  catalog = c.data || [];
  for (const g of catalog) giftById[g.id] = g;
}

// витрина полученных подарков: возвращает [заголовок, содержимое]
function giftsSection(userId, title) {
  const head = el("p", { class: "label" }, title);
  const wrap = el("div", { class: "owned" });
  sb.from("gifts").select("gift_id").eq("recipient_id", userId)
    .order("created_at", { ascending: false }).limit(60)
    .then(({ data }) => {
      if (!data || !data.length) { wrap.replaceWith(el("p", { class: "muted" }, "Пока нет подарков")); return; }
      wrap.replaceChildren(...data.map((r) => el("span", {}, giftById[r.gift_id]?.emoji || "🎁")));
      head.textContent = title + " · " + data.length;
    });
  return [head, wrap];
}

// --- экран входа / регистрации ---
function authView() {
  closeChannel();
  let signup = false;
  const err = el("p", { class: "err" });
  const name = el("input", { placeholder: "Ник", autocomplete: "nickname" });
  const email = el("input", { type: "email", placeholder: "Email", autocomplete: "email" });
  const pass = el("input", { type: "password", placeholder: "Пароль (от 6 символов)", autocomplete: "current-password" });
  const btn = el("button", {});
  const toggle = el("button", { class: "ghost", type: "button" });

  function render() {
    name.style.display = signup ? "" : "none";
    btn.textContent = signup ? "Зарегистрироваться" : "Войти";
    toggle.textContent = signup ? "Уже есть аккаунт? Войти" : "Нет аккаунта? Регистрация";
    err.textContent = "";
  }
  toggle.addEventListener("click", () => { signup = !signup; render(); });

  btn.addEventListener("click", async () => {
    err.textContent = "";
    btn.disabled = true;
    try {
      if (signup) {
        const username = name.value.trim();
        if (username.length < 2) throw new Error("Ник должен быть от 2 символов");
        const { data, error } = await sb.auth.signUp({
          email: email.value.trim(),
          password: pass.value,
          options: { data: { username } },
        });
        if (error) throw error;
        if (!data.session) throw new Error("Подтверди email по письму, затем войди.");
      } else {
        const { error } = await sb.auth.signInWithPassword({
          email: email.value.trim(),
          password: pass.value,
        });
        if (error) throw error;
      }
    } catch (e) {
      err.textContent = e.message;
    } finally {
      btn.disabled = false;
    }
  });

  show(el("div", { class: "auth" }, el("h1", {}, "Мессенджер"), name, email, pass, err, btn, toggle));
  render();
}

// --- список людей ---
async function listView() {
  closeChannel();
  const list = el("div", { class: "list" }, el("p", { class: "muted" }, "Загрузка…"));
  const profileBtn = el("button", { class: "avbtn", type: "button", onclick: profileView }, avatar(myProfile, "sm"));
  show(el("header", {}, profileBtn, el("b", {}, "Люди")), list);

  const { data, error } = await sb.from("profiles").select("id, username, bio, avatar_url")
    .neq("id", me.id).order("username");
  if (error) { list.replaceChildren(el("p", { class: "muted" }, "Ошибка: " + error.message)); return; }
  if (!data.length) {
    list.replaceChildren(el("p", { class: "muted" }, "Пока никого нет. Пригласи друзей зарегистрироваться."));
    return;
  }
  list.replaceChildren(...data.map((u) =>
    el("button", { class: "row", onclick: () => chatView(u) },
      avatar(u),
      el("span", {}, el("span", {}, u.username), ...(u.bio ? [el("small", {}, u.bio.slice(0, 60))] : [])))
  ));
}

// --- мой профиль (редактирование) ---
function profileView() {
  closeChannel();
  let avatarUrl = myProfile.avatar_url || null;
  const err = el("p", { class: "err" });
  const nameInput = el("input", { value: myProfile.username, maxlength: "30", placeholder: "Ник" });
  const bioInput = el("textarea", { rows: "3", maxlength: "200", placeholder: "Расскажи о себе" }, myProfile.bio || "");
  const fileInput = el("input", { type: "file", accept: "image/*", style: "display:none" });
  const saveBtn = el("button", { type: "button" }, "Сохранить");
  const avBtn = el("button", { class: "avbtn", type: "button", onclick: () => fileInput.click() });

  function renderAvatar() {
    avBtn.replaceChildren(
      avatar({ username: nameInput.value || myProfile.username, avatar_url: avatarUrl }, "big"),
      el("span", {}, "Изменить фото")
    );
  }

  fileInput.addEventListener("change", async () => {
    const file = fileInput.files[0];
    if (!file) return;
    err.textContent = "";
    saveBtn.disabled = true;
    try {
      const blob = await resizeToSquare(file);
      const path = `${me.id}/${Date.now()}.jpg`;
      const { error } = await sb.storage.from("avatars").upload(path, blob, { contentType: "image/jpeg" });
      if (error) throw error;
      avatarUrl = sb.storage.from("avatars").getPublicUrl(path).data.publicUrl;
      renderAvatar();
    } catch (e) {
      err.textContent = e.message;
    } finally {
      saveBtn.disabled = false;
      fileInput.value = "";
    }
  });

  nameInput.addEventListener("input", () => { if (!avatarUrl) renderAvatar(); });

  saveBtn.addEventListener("click", async () => {
    const username = nameInput.value.trim();
    if (username.length < 2) { err.textContent = "Ник должен быть от 2 символов"; return; }
    err.textContent = "";
    saveBtn.disabled = true;
    const patch = { username, bio: bioInput.value.trim() || null, avatar_url: avatarUrl };
    const { error } = await sb.from("profiles").update(patch).eq("id", me.id);
    saveBtn.disabled = false;
    if (error) { err.textContent = error.message; return; }
    Object.assign(myProfile, patch);
    listView();
  });

  const logout = el("button", { class: "danger", type: "button", onclick: () => sb.auth.signOut() }, "Выйти из аккаунта");

  show(
    el("header", {}, el("button", { class: "icon", onclick: listView }, "←"), el("b", {}, "Мой профиль")),
    el("div", { class: "profile" },
      el("div", { class: "center" }, avBtn),
      el("div", { class: "balance" }, el("span", { class: "stars" }, "⭐ " + wallet), el("span", {}, "звёзд на счёте")),
      el("p", { class: "label" }, "Ник"), nameInput,
      el("p", { class: "label" }, "О себе"), bioInput,
      ...giftsSection(me.id, "Мои подарки"),
      el("p", { class: "label" }, "Email: " + (me.email || "")),
      err, saveBtn, logout, fileInput)
  );
  renderAvatar();
}

// --- профиль собеседника ---
function peerProfileView(peer) {
  closeChannel();
  show(
    el("header", {}, el("button", { class: "icon", onclick: () => chatView(peer) }, "←"), el("b", {}, "Профиль")),
    el("div", { class: "profile" },
      el("div", { class: "center" }, avatar(peer, "big"), el("h2", {}, peer.username)),
      el("p", { class: "label" }, "О себе"),
      el("p", { class: "bio" }, peer.bio || "Пока ничего не написано"),
      ...giftsSection(peer.id, "Подарки"),
      el("button", { onclick: () => giftView(peer) }, "🎁 Подарить подарок"),
      el("button", { class: "ghost", onclick: () => chatView(peer) }, "Написать сообщение"))
  );
}

// --- выбор и отправка подарка ---
function giftView(peer) {
  closeChannel();
  let selected = null;
  const err = el("p", { class: "err" });
  const comment = el("input", { placeholder: "Подпись (необязательно)", maxlength: "200" });
  const sendBtn = el("button", { type: "button", disabled: "" }, "Выбери подарок");
  const grid = el("div", { class: "gifts-grid" });

  function updateBtn() {
    if (!selected) { sendBtn.disabled = true; sendBtn.textContent = "Выбери подарок"; return; }
    sendBtn.disabled = false;
    sendBtn.textContent = "Подарить за ⭐ " + selected.price;
  }
  function renderGrid() {
    if (!catalog.length) { grid.replaceChildren(el("p", { class: "muted" }, "Подарки пока недоступны")); return; }
    grid.replaceChildren(...catalog.map((g) =>
      el("button", {
        class: "gtile" + (selected === g ? " sel" : ""), type: "button",
        onclick: () => { selected = g; renderGrid(); updateBtn(); },
      },
        el("span", { class: "gemoji" }, g.emoji),
        el("span", {}, g.name),
        el("span", { class: "stars" }, "⭐ " + g.price))
    ));
  }

  sendBtn.addEventListener("click", async () => {
    if (!selected) return;
    err.textContent = "";
    sendBtn.disabled = true;
    const { error } = await sb.rpc("send_gift", {
      p_recipient: peer.id, p_gift_id: selected.id, p_comment: comment.value.trim() || null,
    });
    if (error) { err.textContent = error.message; updateBtn(); return; }
    await loadWalletAndCatalog();
    chatView(peer);
  });

  show(
    el("header", {},
      el("button", { class: "icon", onclick: () => chatView(peer) }, "←"),
      el("b", {}, "Подарок для " + peer.username),
      el("span", { class: "stars" }, "⭐ " + wallet)),
    el("div", { class: "profile" }, grid, comment, err, sendBtn)
  );
  renderGrid();
  updateBtn();
}

// --- личный чат ---
async function chatView(peer) {
  closeChannel();
  const box = el("div", { class: "msgs" });
  const input = el("input", { placeholder: "Сообщение", autocomplete: "off" });
  const form = el("form", { class: "composer" },
    el("button", { class: "gbtn", type: "button", onclick: () => giftView(peer) }, "🎁"),
    input, el("button", { type: "submit" }, "➤"));
  const head = el("button", { class: "peerhead", type: "button", onclick: () => peerProfileView(peer) },
    avatar(peer, "sm"), el("span", {}, peer.username));
  show(el("header", {}, el("button", { class: "icon", onclick: listView }, "←"), head), box, form);

  const seen = new Set();
  function add(m) {
    if (seen.has(m.id)) return;
    seen.add(m.id);
    const time = new Date(m.created_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    const cls = "msg " + (m.sender_id === me.id ? "mine" : "theirs") + (m.gift_id ? " gift" : "");
    let content;
    if (m.gift_id) {
      const g = giftById[m.gift_id] || { emoji: "🎁", name: "Подарок" };
      content = [el("span", { class: "gemoji" }, g.emoji), el("span", { class: "gname" }, g.name)];
      if (m.body && m.body !== "Подарок") content.push(el("span", { class: "gcomment" }, m.body));
    } else {
      content = [el("span", {}, m.body)];
    }
    box.append(el("div", { class: cls }, ...content, el("small", {}, time)));
    box.scrollTop = box.scrollHeight;
  }

  // история (последние 200)
  const { data, error } = await sb.from("messages").select("*")
    .or(`and(sender_id.eq.${me.id},recipient_id.eq.${peer.id}),and(sender_id.eq.${peer.id},recipient_id.eq.${me.id})`)
    .order("created_at", { ascending: false }).limit(200);
  if (error) { box.append(el("p", { class: "muted" }, "Ошибка: " + error.message)); return; }
  data.reverse().forEach(add);

  // новые сообщения в реальном времени
  channel = sb.channel("chat-" + me.id + "-" + peer.id)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, (p) => {
      const m = p.new;
      const ok = (m.sender_id === peer.id && m.recipient_id === me.id) ||
                 (m.sender_id === me.id && m.recipient_id === peer.id);
      if (ok) add(m);
    })
    .subscribe();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    const { data: row, error: err } = await sb.from("messages")
      .insert({ recipient_id: peer.id, body: text }).select().single();
    if (err) { input.value = text; alert("Не отправилось: " + err.message); }
    else add(row);
  });
  input.focus();
}

// --- запуск: показываем нужный экран по состоянию входа ---
let currentUid;
sb.auth.onAuthStateChange((_event, session) => {
  const uid = session?.user?.id ?? null;
  if (uid === currentUid) return; // обновление токена не должно сбрасывать экран
  currentUid = uid;
  me = session?.user ?? null;
  if (!uid) { myProfile = null; authView(); return; }
  setTimeout(async () => { await loadMyProfile(); await loadWalletAndCatalog(); listView(); }, 0);
});
</script>
</body>
</html>
