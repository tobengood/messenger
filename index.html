<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1015">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SmartGram</title>
<style>
  :root{--bg:#06070a;--panel:#0e1015;--line:#1a1d24;--text:#e8eaf0;--muted:#8b91a0;--accent:#4c8dff;--mine:#2b5fd9;--theirs:#1a1d26}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,sans-serif}
  #app{height:100dvh;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  header b{flex:1;font-size:18px}
  button{font:inherit;border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:#fff;cursor:pointer}
  button:disabled{opacity:.6}
  button.icon{background:none;padding:4px 8px;font-size:22px;color:var(--text)}
  button.ghost{background:none;color:var(--muted);padding:6px 8px}
  button.danger{background:none;color:#ff6b6b}
  input,textarea{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
  textarea{resize:vertical}
  .auth{padding:24px 16px;display:flex;flex-direction:column;gap:12px;margin:auto 0}
  .auth h1{margin:0 0 8px}
  .err{color:#ff6b6b;min-height:1.4em;margin:0}
  .muted{color:var(--muted);padding:16px;margin:0}
  .tabbar{display:flex;background:var(--panel);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border-radius:12px;padding:6px 0;color:var(--muted);font-size:12px}
  .tab .ti{font-size:22px;line-height:26px;height:26px;display:flex;align-items:center}
  .tab .avatar{width:26px;height:26px;font-size:12px}
  .tab.on{color:var(--accent)}
  header.bare{background:none;border-bottom:0;position:absolute;left:0;top:0;z-index:2}
  #app{position:relative}
  .pscroll{flex:1;overflow:auto;padding-bottom:16px}
  .pscroll .center{display:flex;justify-content:center;padding:8px 0}
  .hero{display:flex;flex-direction:column;align-items:center;gap:4px;padding:28px 16px 8px;background:linear-gradient(180deg,#1c2a4d 0%,transparent 100%)}
  .hero .avatar{box-shadow:0 0 0 4px rgba(76,141,255,.25)}
  .hero h2{margin:10px 0 0;font-size:24px;overflow-wrap:anywhere;text-align:center}
  .hero .sub{color:var(--muted);font-size:14px}
  .actions{display:flex;gap:10px;padding:12px 16px 4px}
  .act{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--panel);color:var(--text);border-radius:16px;padding:12px 4px;font-size:13px}
  .act .ai{font-size:22px;line-height:26px}
  .island{background:var(--panel);border-radius:18px;margin:12px 16px 0;padding:2px 16px}
  .island.pad{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .irow{display:block;width:100%;text-align:left;background:none;border-radius:0;color:var(--text);padding:12px 0;border-bottom:1px solid var(--line)}
  .irow:last-child{border-bottom:0}
  .irow .iv{font-size:16px;overflow-wrap:anywhere;white-space:pre-wrap}
  .irow .il{color:var(--muted);font-size:13px;margin-top:2px}
  .pill{display:inline-block;margin:12px 0 6px;padding:6px 14px;border-radius:999px;background:rgba(76,141,255,.18);color:var(--accent);font-weight:600;font-size:14px}
  .island.gifts{padding-bottom:12px}
  .island.gifts .muted{padding:8px 0}
  .ptabs{display:flex;gap:4px;margin:16px 16px 0;padding:5px;background:var(--panel);border-radius:999px;overflow-x:auto;scrollbar-width:none}
  .ptabs::-webkit-scrollbar{display:none}
  .ptab{flex:none;background:none;color:var(--muted);border-radius:999px;padding:8px 16px;font-weight:600;font-size:15px}
  .ptab.on{background:rgba(76,141,255,.2);color:var(--accent)}
  .pbody{padding:12px 16px 0}
  .stubmini{text-align:center;color:var(--muted);padding:36px 0}
  .stubmini b{display:block;font-size:18px;color:var(--text);margin-bottom:4px}
  .chips{display:flex;gap:8px;margin-bottom:12px}
  .chip{padding:8px 16px;border-radius:999px;background:var(--panel);font-weight:600}
  .ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .gcard{position:relative;aspect-ratio:1;background:var(--panel);border-radius:18px;padding:0;display:grid;place-items:center;color:var(--text)}
  .gcard.dim .gbig{opacity:.35}
  .gbig{font-size:68px;line-height:1}
  .gsender{position:absolute;left:8px;top:8px}
  .gcard .gsender .avatar.sm{width:24px;height:24px;font-size:11px}
  .ghid{position:absolute;bottom:8px;font-size:12px;color:var(--muted)}
  .hint{color:var(--muted);text-align:center;font-size:14px;margin:16px 8px 0}
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
  .sheet{width:100%;max-width:640px;background:#202228;border-radius:24px 24px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom));text-align:center;max-height:92dvh;overflow:auto}
  .sheetemoji{font-size:128px;line-height:1.1;margin-top:8px}
  .sheet h2{margin:8px 0 4px;font-size:24px}
  .sheetsub{color:var(--text);margin:0 0 16px}
  .gtable{border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left}
  .gtable>div{display:flex;align-items:center;border-bottom:1px solid var(--line)}
  .gtable>div:last-child{border-bottom:0}
  .gtable>div>span{flex:none;width:34%;padding:14px 12px;font-weight:700;background:rgba(255,255,255,.04);align-self:stretch;display:flex;align-items:center}
  .gtable>div>div{padding:10px 12px;display:flex;align-items:center;gap:8px;flex:1;min-width:0}
  .gtable .from{flex-wrap:wrap}
  .gtable .from .avatar.sm{width:28px;height:28px;font-size:13px}
  .gtable .from b{max-width:100%;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tagbtn{background:rgba(76,141,255,.2);color:var(--accent);border-radius:999px;padding:4px 10px;font-size:13px;flex:none}
  .sheetnote{color:var(--muted);font-size:14px;margin:14px 0}
  .linkbtn{background:none;color:var(--accent);padding:0;font-size:14px}
  .sendg{width:auto;padding:14px 28px}
  .okbtn{width:100%;border-radius:999px;padding:14px;font-weight:700;margin-top:6px}
  .fab{position:absolute;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;padding:0;font-size:24px;box-shadow:0 6px 18px rgba(43,95,217,.55);z-index:5}
  .backdrop.clear{background:transparent;align-items:flex-end;justify-content:flex-end}
  .fabmenu{margin:0 16px calc(156px + env(safe-area-inset-bottom)) 0;background:#23262e;border-radius:18px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);min-width:250px}
  .mitem{display:flex;align-items:center;gap:12px;width:100%;background:none;color:var(--text);text-align:left;padding:10px 12px;border-radius:12px}
  .mitem:active{background:rgba(255,255,255,.07)}
  .mitem .mi{font-size:24px}
  .mitem b{display:block;font-weight:600}
  .mitem small{display:block;color:var(--muted);font-size:13px}
  .sname{display:block;font-weight:600;font-size:14px;margin-bottom:1px}
  .readonly{padding:16px;text-align:center;color:var(--muted);background:var(--panel);border-top:1px solid var(--line);padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .ptitle{display:block;font-weight:600;line-height:1.2}
  .peerhead small{display:block;font-weight:400;color:var(--muted);font-size:13px;line-height:1.2}
  .namerow{display:flex;gap:12px;align-items:center}
  .avpick{flex:none;width:56px;height:56px;border-radius:50%;padding:0;font-size:24px;background:rgba(76,141,255,.2);overflow:hidden}
  .avpick img{width:100%;height:100%;object-fit:cover;display:block}
  .typeopt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.04);color:var(--text);border:2px solid transparent;border-radius:14px;padding:10px 14px}
  .typeopt.on{border-color:var(--accent)}
  .typeopt b{display:block}
  .typeopt small{color:var(--muted)}
  .linkbox{display:flex;flex-direction:column;gap:6px}
  .island.flush{padding:0;overflow:hidden}
  .island.flush .row:last-child{border-bottom:0}
  .row.sel{background:rgba(76,141,255,.12)}
  .chk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:#fff;line-height:1}
  .row.sel .chk{background:var(--accent);border-color:var(--accent)}
  .footbar{padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
  .footbar .err{min-height:0}
  .nm{display:inline-flex;align-items:center;gap:0;max-width:100%}
  .badge{display:inline-block;flex:none;margin-left:.45em;vertical-align:middle;cursor:pointer;line-height:0}
  .badge.bl{margin-left:0;margin-right:.45em}
  .verif{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin:10px 20px 0}
  .toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2b2f39;color:var(--text);padding:12px 18px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:80;max-width:86vw;text-align:center;font-size:15px}
  .duo{display:flex;gap:10px}
  .duo button{flex:1}
  button.warn{background:#c0392b}
  select.sel{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
  .stub{flex:1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:24px}
  .stub b{display:block;font-size:20px;color:var(--text);margin-bottom:4px}
  .ok{color:#4cd08a;min-height:1.4em;margin:0}
  .searchbox{padding:8px 16px;border-bottom:1px solid var(--line)}
  .label{color:var(--muted);font-size:13px;margin:4px 0 -6px}
  .list{flex:0 1 auto;min-height:0;overflow:auto;margin:12px 16px;border-radius:18px}
  .list .row:last-child{border-bottom:0}
  .tabbar{margin-top:auto}
  .row{display:flex;align-items:center;gap:12px;width:100%;background:none;border-radius:0;border-bottom:1px solid var(--line);padding:12px 16px;text-align:left;color:var(--text)}
  .row small{display:block;color:var(--muted);font-size:13px}
  .rowtxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .rowtop{display:flex;align-items:baseline;gap:8px}
  .rowtop b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .rowtop small{flex:none}
  .rowsub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .brand{font-size:22px}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:600;flex:none;overflow:hidden;color:#fff}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .avatar.sm{width:36px;height:36px;font-size:15px}
  .avatar.big{width:112px;height:112px;font-size:46px}
  .avbtn{background:none;padding:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--accent);font-size:14px}
  .peerhead{display:flex;align-items:center;gap:10px;background:none;padding:0;color:var(--text);font-weight:600;flex:1;text-align:left;font-size:18px}
  .profile{flex:1;overflow:auto;padding:24px 16px;display:flex;flex-direction:column;gap:12px}
  .profile .center{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
  .profile h2{margin:0}
  .bio{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}
  .msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:3px}
  .msg{max-width:82%;padding:7px 12px 6px;border-radius:18px;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.3}
  .msg.first{margin-top:6px}
  .msg .mt{float:right;margin:7px 0 -3px 12px;font-size:12px;line-height:1;opacity:.6;white-space:nowrap}
  .msg.gift .mt{float:none;display:block;text-align:right;margin:4px 0 -2px}
  .daysep{align-self:center;margin:10px 0 6px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.09);color:var(--text);font-size:13px;font-weight:500}
  .mine{align-self:flex-end;background:var(--mine)}
  .theirs{align-self:flex-start;background:var(--theirs)}
  .mine.tail{border-bottom-right-radius:5px}
  .theirs.tail{border-bottom-left-radius:5px}
  .composer{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
  .composer .gbtn{background:none;padding:0 6px;font-size:24px}
  .msg.gift{text-align:center;min-width:150px}
  .msg.gift .gemoji{font-size:56px;line-height:1.15;display:block}
  .msg.gift .gname{font-weight:600;display:block}
  .msg.gift .gcomment{display:block;margin-top:2px;opacity:.9}
  .stars{color:#ffc94d;font-weight:600}
  .balance{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--panel);border-radius:12px}
  .gifts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .gtile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:14px;background:var(--panel);border:2px solid transparent;color:var(--text)}
  .gtile.sel{border-color:var(--accent)}
  .gtile .gemoji{font-size:40px;line-height:1.15}
  .gtile .stars{font-size:14px}
  .owned{display:flex;flex-wrap:wrap;gap:8px}
  .owned span{font-size:30px;background:var(--panel);border-radius:12px;padding:6px 10px}

  .composer.tg{align-items:flex-end;gap:8px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:transparent;border-top:0}
  .cwrap{background:var(--bg)}
  .cfield{flex:1;display:flex;align-items:center;background:var(--panel);border-radius:24px;padding:0 6px;min-height:48px;min-width:0}
  .cfield input{border:0;background:transparent;padding:12px 4px;border-radius:0;outline:0}
  .cbtn{background:none;color:var(--muted);padding:6px;border-radius:50%;display:grid;place-items:center;font-size:22px;line-height:1;flex:none}
  .cbtn.gift{font-size:21px;filter:grayscale(1) brightness(1.4)}
  .cbtn.trash{color:#ff6b6b}
  .sendbtn{flex:none;width:48px;height:48px;border-radius:50%;padding:0;display:grid;place-items:center;background:var(--accent);color:#fff}
  .cfield.rec{gap:10px;padding-right:14px}
  .recdot{width:10px;height:10px;border-radius:50%;background:#ff4d4d;animation:blink 1s infinite}
  .rectime{font-variant-numeric:tabular-nums}
  .rechint{color:var(--muted);font-size:14px;margin-left:auto}
  @keyframes blink{50%{opacity:.25}}
  .sending{padding:6px 16px;color:var(--muted);font-size:13px;text-align:center}
  .emojipanel{height:270px;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column}
  .etabs{display:flex;border-bottom:1px solid var(--line)}
  .etab{flex:1;background:none;padding:8px 0;font-size:22px;border-radius:0;border-bottom:2px solid transparent}
  .etab.on{border-bottom-color:var(--accent)}
  .egrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(8,1fr);align-content:start;padding:6px}
  .eb{background:none;padding:4px 0;font-size:26px;line-height:1.3;border-radius:8px}
  .eb:active{background:rgba(255,255,255,.1)}
  .sheet.attach{padding-top:10px;text-align:left}
  .msg.media{padding:4px 4px 6px}
  .msg.media .mcap{display:block;padding:4px 8px 0}
  .msg.media .mt{margin-right:6px}
  .chatimg{display:block;max-width:100%;max-height:340px;border-radius:14px;background:#000}
  video.chatimg{width:100%}
  .viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:90;display:grid;place-items:center}
  .viewer img{max-width:100%;max-height:100%;object-fit:contain}
  .pv{position:fixed;inset:0;background:#000;z-index:70;display:flex;flex-direction:column}
  .pvx{position:absolute;left:8px;top:8px;color:#fff;z-index:2}
  .pvm{flex:1;display:grid;place-items:center;min-height:0}
  .pvm img,.pvm video{max-width:100%;max-height:100%}
  .pvbar{display:flex;gap:8px;align-items:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#111}
  .msg.voice{min-width:230px}
  .voice{display:flex;align-items:center;gap:10px;padding:2px 0}
  .vplay{flex:none;width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center;background:var(--accent);color:#fff}
  .mine .vplay{background:#fff;color:var(--mine)}
  .vbody{flex:1;min-width:0}
  .wave{display:flex;align-items:center;gap:2px;height:26px;cursor:pointer}
  .wave i{flex:1;min-width:2px;border-radius:2px;background:rgba(255,255,255,.35)}
  .theirs .wave i{background:rgba(139,145,160,.55)}
  .wave i.on{background:#fff}
  .theirs .wave i.on{background:var(--accent)}
  .vdur{font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}
  .sysisland{align-self:center;margin:12px 0 6px;padding:7px 16px;border-radius:999px;background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:14px;font-weight:500;text-align:center;max-width:92%}
  .giftcard{align-self:center;width:min(290px,86%);margin:2px 0 10px;padding:14px 14px 16px;border-radius:22px;background:rgba(255,255,255,.07);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.06);text-align:center}
  .gcemoji{font-size:116px;line-height:1.1}
  .gctitle{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;margin-top:6px;flex-wrap:wrap}
  .gctitle .avatar.sm{width:22px;height:22px;font-size:11px}
  .gccomment{margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}
  .gcsub{color:var(--muted);font-size:14px;margin:6px 4px 12px}
  .gcbtn{background:rgba(255,255,255,.12);color:var(--text);border-radius:999px;padding:9px 26px;font-weight:600}
  header.bare{right:0;justify-content:space-between}
  .backdrop.clear.top{align-items:flex-start}
  .popmenu{margin:58px 12px 0 0;background:#23262e;border-radius:18px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);min-width:250px}
  .mitem.danger b{color:#ff6b6b}
  .nft{background:linear-gradient(90deg,#ff3b5c,#ff9a3c,#ff3b8f,#ff3b5c);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:shine 3s linear infinite;font-weight:600}
  @keyframes shine{to{background-position:300% 0}}
  .nfttitle{display:block;font-size:17px}
  .gart{display:inline-block;position:relative;width:1em;height:1em;line-height:1;vertical-align:middle}
  .gart img{width:100%;height:100%;object-fit:contain;display:block}
  .gart .acc{position:absolute;right:-.06em;top:-.04em;font-size:.34em;line-height:1}
  .gtile .gart{font-size:46px}
  .gcard .gart{font-size:68px}
  .sheet .gart{font-size:128px;margin-top:8px}
  .giftcard .gart{font-size:116px}
  .sheet.up{background-size:120px 110px,cover}
  .gcard.up{background-size:120px 110px,cover}
  .sheet.up .gtable{background:rgba(0,0,0,.28)}
  .bluebig{width:100%;border-radius:999px;padding:15px;font-weight:700;font-size:16px;background:#2f8cf0;color:#fff;margin-top:8px}
  .rar{opacity:.65;font-size:12px;margin-left:6px}
  .left{font-size:11px;opacity:.7}
  .sw{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:middle;margin-right:8px}
  .pick{max-height:260px;overflow:auto;display:block}
  .pick button{display:flex;align-items:center;width:100%;text-align:left;margin:2px 0;padding:10px 12px;border-radius:12px}
  .pick button.on{outline:2px solid #2f8cf0}

// обрезаем фото до квадрата и уменьшаем, чтобы загрузка была быстрой
function resizeToSquare(file, size = 256) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(img.width, img.height);
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = size;
      canvas.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url);
      canvas.toBlob((b) => (b ? resolve(b) : reject(new Error("Не удалось обработать фото"))), "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Не удалось открыть изображение")); };
    img.src = url;
  });
}

let playingAudio = null;
function voiceNode(m) {
  const N = 32;
  let seed = [...String(m.id)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const bars = Array.from({ length: N }, () => el("i", { style: `height:${6 + Math.round(rnd() * 18)}px` }));
  const wave = el("div", { class: "wave" }, ...bars);
  const btn = svgBtn("vplay", ICON.play);
  const total = m.media_duration || 0;
  const dur = el("span", { class: "vdur" }, fmtDur(total));
  const audio = new Audio(m.media_url);
  audio.preload = "none";
  const paint = () => {
    const t = total || (isFinite(audio.duration) ? audio.duration : 0);
    const k = t ? audio.currentTime / t : 0;
    bars.forEach((b, i) => b.classList.toggle("on", i < Math.round(k * N)));
    dur.textContent = fmtDur(audio.paused && audio.currentTime === 0 ? t : audio.currentTime);
  };
  audio.addEventListener("timeupdate", paint);
  audio.addEventListener("ended", () => { audio.currentTime = 0; setIcon(btn, ICON.play); bars.forEach((b) => b.classList.remove("on")); dur.textContent = fmtDur(total); });
  audio.addEventListener("pause", () => setIcon(btn, ICON.play));
  audio.addEventListener("play", () => setIcon(btn, ICON.pause));
  btn.addEventListener("click", () => {
    if (audio.paused) {
      if (playingAudio && playingAudio !== audio) playingAudio.pause();
      playingAudio = audio;
      audio.play().catch(() => alert("Не удалось воспроизвести"));
    } else audio.pause();
  });
  wave.addEventListener("click", (e) => {
    const r = wave.getBoundingClientRect();
    const t = total || (isFinite(audio.duration) ? audio.duration : 0);
    if (t) { audio.currentTime = ((e.clientX - r.left) / r.width) * t; paint(); }
  });
  return el("div", { class: "voice" }, btn, el("div", { class: "vbody" }, wave, dur));
}

const MONTHS = ["янв.", "февр.", "мар.", "апр.", "мая", "июня", "июля", "авг.", "сент.", "окт.", "нояб.", "дек."];
function fmtBirthday(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const now = new Date();
  let age = now.getFullYear() - y;
  if (now.getMonth() + 1 < m || (now.getMonth() + 1 === m && now.getDate() < d)) age--;
  return d + " " + MONTHS[m - 1] + " " + y + " (" + plural(age, ["год", "года", "лет"]) + ")";
}
const WH_RE = /^(\d{1,2}):(\d{2})\s*[-–]\s*(\d{1,2}):(\d{2})$/;
function workStatus(wh) {
  if (!wh) return null;
  if (/^24\/7$/i.test(wh.trim())) return { text: "Открыто 24/7", open: true, hours: "Часы работы" };
  const m = WH_RE.exec(wh.trim());
  if (!m) return { text: wh, open: null, hours: "Часы работы" };
  const a = +m[1] * 60 + +m[2], b = +m[3] * 60 + +m[4], n = new Date().getHours() * 60 + new Date().getMinutes();
  const open = a <= b ? n >= a && n < b : n >= a || n < b;
  return { text: open ? "Открыто" : "Закрыто", open, hours: "Часы работы · " + m[1].padStart(2, "0") + ":" + m[2] + " – " + m[3].padStart(2, "0") + ":" + m[4] };
}

  if (!p.phone && !mine) return [];
  const r = infoRow("Номер телефона", p.phone ? formatPhone(p.phone) : "Не указан — нажми, чтобы получить", mine ? () => (p.phone ? phoneMenu() : phoneShop()) : null);

}

// --- юзернеймы ---
const HANDLE_RE = /^[a-z0-9_]{5,32}$/;
const HANDLE_DOMAIN = "@smartgram.app"; // служебный адрес: пользователю email не нужен
const normHandle = (v) => v.trim().replace(/^@/, "").toLowerCase();
const handleError = (h) => HANDLE_RE.test(h) ? null :
  "Юзернейм: от 5 до 32 символов, только латиница a-z, цифры и _";

// --- экран входа / регистрации ---
function authView() {
  closeChannel();
  let signup = false;
  const err = el("p", { class: "err" });
  const name = el("input", { placeholder: "Ник (как тебя видят друзья)", maxlength: "30", autocomplete: "nickname" });
  const login = el("input", { placeholder: "Юзернейм", autocapitalize: "none", autocorrect: "off", spellcheck: "false", autocomplete: "username" });
  const pass = el("input", { type: "password", placeholder: "Пароль (от 6 символов)", autocomplete: "current-password" });
  const pass2 = el("input", { type: "password", placeholder: "Повтори пароль", autocomplete: "new-password" });
  const btn = el("button", {});
  const toggle = el("button", { class: "ghost", type: "button" });

  function render() {
    name.style.display = signup ? "" : "none";
    pass2.style.display = signup ? "" : "none";
    login.placeholder = signup ? "Юзернейм (от 5 символов, a-z 0-9 _)" : "Юзернейм (или email)";
    btn.textContent = signup ? "Зарегистрироваться" : "Войти";
    toggle.textContent = signup ? "Уже есть аккаунт? Войти" : "Нет аккаунта? Регистрация";
    err.textContent = "";
  }
  toggle.addEventListener("click", () => { signup = !signup; render(); });

  btn.addEventListener("click", async () => {
    err.textContent = "";
    btn.disabled = true;
    try {
      if (signup) {
        const nick = name.value.trim();
        const handle = normHandle(login.value);
        if (nick.length < 2) throw new Error("Ник должен быть от 2 символов");
        const he = handleError(handle);
        if (he) throw new Error(he);
        if (pass.value.length < 6) throw new Error("Пароль должен быть от 6 символов");
        if (pass.value !== pass2.value) throw new Error("Пароли не совпадают");
        const { data: free, error: ce } = await sb.rpc("handle_available", { h: handle });
        if (ce) throw ce;
        if (!free) throw new Error("Этот юзернейм уже занят");
        const { data, error } = await sb.auth.signUp({
          email: handle + HANDLE_DOMAIN,
          password: pass.value,
          options: { data: { username: nick, handle } },
        });
        if (error) throw error;
        if (!data.session) throw new Error("Не удалось войти сразу после регистрации. Попробуй войти.");
      } else {
        const v = login.value.trim();
        const email = v.includes("@") && !v.startsWith("@") ? v : normHandle(v) + HANDLE_DOMAIN;
        const { error } = await sb.auth.signInWithPassword({ email, password: pass.value });
        if (error) throw new Error(error.message === "Invalid login credentials" ? "Неверный юзернейм или пароль" : error.message);
      }
    } catch (e) {
      err.textContent = e.message;
    } finally {
      btn.disabled = false;
    }
  });

  show(el("div", { class: "auth" }, el("h1", {}, APP_NAME), name, login, pass, pass2, err, btn, toggle));
  render();
}

// --- чаты (диалоги, группы, каналы) + поиск ---
function shortTime(iso) {
  const d = new Date(iso), now = new Date();
  if (d.toDateString() === now.toDateString())
    return d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" });
}

function plural(n, f) {
  const a = Math.abs(n) % 100, b = a % 10;
  return n + " " + (a > 10 && a < 20 ? f[2] : b > 1 && b < 5 ? f[1] : b === 1 ? f[0] : f[2]);
}
const membersText = (c, n) => c.kind === "channel"
  ? plural(n, ["подписчик", "подписчика", "подписчиков"])
  : plural(n, ["участник", "участника", "участников"]);
const chatAsPerson = (c) => ({ username: c.title, avatar_url: c.avatar_url });

function personRow(u, sub, time, onclick, unread) {
  return el("button", { class: "row", onclick: onclick || (() => chatView(u)) },
    avatar(u),
    el("span", { class: "rowtxt" },
      el("span", { class: "rowtop" }, el("b", {}, nameWithBadge(u, 15)), ...(time ? [el("small", { class: unread ? "new" : "" }, time)] : [])),
      el("span", { class: "rowbot" }, el("small", { class: "rowsub" }, sub || "\u00a0"),
        ...(unread ? [el("span", { class: "ub" }, unread > 99 ? "99+" : String(unread))] : []))));
}

async function listView() {
  closeChannel();
  loadLocalRead();
  const list = el("div", { class: "list" }, el("p", { class: "muted" }, "Загрузка…"));
  const search = el("input", { class: "search", placeholder: "🔍 Поиск по @юзернейму или нику", autocapitalize: "none", spellcheck: "false" });
  const fab = el("button", { class: "fab", type: "button", onclick: createMenu, "aria-label": "Создать" }, "✏️");
  let folder = "all", allRows = [];
  const ftabs = el("div", { class: "ptabs ftabs" });
  const FOLDERS = [["all", "Все чаты"], ["u", "Личные"], ["group", "Группы"], ["channel", "Каналы"]];
  function draw() {
    ftabs.replaceChildren(...FOLDERS.map(([id, label]) => el("button", { class: "ptab" + (folder === id ? " on" : ""), type: "button",
      onclick: () => { folder = id; draw(); } }, label)));
    const rows = allRows.filter((r) => folder === "all" || r.kind === folder);
    list.replaceChildren(...(rows.length ? rows.map((r) => r.node) : [el("p", { class: "muted center" }, allRows.length ? "В этой папке пока пусто" : "Чатов пока нет")]));
  }
  show(el("header", {}, el("b", { class: "brand" }, APP_NAME)),
    el("div", { class: "searchbox" }, search), ftabs, list, tabBar("chats"), fab);
  draw();

  let seq = 0;
  async function loadDialogs() {
    const my = ++seq;
    const [mr, cm, rd] = await Promise.all([
      sb.from("messages").select("sender_id, recipient_id, chat_id, body, gift_id, media_type, created_at")
        .order("created_at", { ascending: false }).limit(500),
      sb.from("chat_members").select("chat_id").eq("user_id", me.id),
      sb.from("chat_reads").select("key, last_read").eq("user_id", me.id),
    ]);
    if (my !== seq) return;
    if (mr.error) { list.replaceChildren(el("p", { class: "muted" }, "Ошибка: " + mr.error.message)); return; }
    const last = new Map(), unread = new Map();
    const reads = new Map((rd.data || []).map((r) => [r.key, r.last_read]));
    for (const m of mr.data) {
      const key = m.chat_id ? "c:" + m.chat_id : "u:" + (m.sender_id === me.id ? m.recipient_id : m.sender_id);
      if (!last.has(key)) last.set(key, m);
      const seenMs = Math.max(reads.has(key) ? Date.parse(reads.get(key)) : 0, localRead.get(key) || 0);
      if (m.sender_id !== me.id && Date.parse(m.created_at) > seenMs) unread.set(key, (unread.get(key) || 0) + 1);
    }
    const favKey = "u:" + me.id;
    if (!last.has(favKey)) last.set(favKey, null);
    for (const r of cm.data || []) if (!last.has("c:" + r.chat_id)) last.set("c:" + r.chat_id, null);
    if (!last.size) {
      list.replaceChildren(el("p", { class: "muted" }, "Чатов пока нет. Найди друга через поиск по @юзернейму или нажми ✏️, чтобы создать группу."));
      return;
    }
    const chatIds = [], userIds = new Set();
    for (const [k, m] of last) {
      if (k[0] === "c") { chatIds.push(k.slice(2)); if (m && m.sender_id !== me.id) userIds.add(m.sender_id); }
      else userIds.add(k.slice(2));
    }
    const [cr, pr] = await Promise.all([
      chatIds.length ? sb.from("chats").select("*").in("id", chatIds) : { data: [] },
      userIds.size ? sb.from("profiles").select("id, username, handle, bio, avatar_url, badge").in("id", [...userIds]) : { data: [] },
    ]);
    if (my !== seq) return;
    const chatById = new Map((cr.data || []).map((c) => [c.id, c]));
    const profById = new Map((pr.data || []).map((u) => [u.id, u]));
    const rows = [];
    for (const [k, m] of last) {
      const text = m ? (m.gift_id ? "🎁 Подарок" : m.media_type ? mediaLabel(m) : m.body) : "";
      if (k === favKey) {
        rows.push({ kind: "u", ts: m ? m.created_at : "", node: personRow(FAV(), m ? text : "Сохраняйте здесь сообщения и подарки", m ? shortTime(m.created_at) : "") });
        continue;
      }
      if (k[0] === "c") {
        const c = chatById.get(k.slice(2));
        if (!c) continue;
        const who = m && c.kind === "group" ? (m.sender_id === me.id ? "Вы" : (profById.get(m.sender_id)?.username || "?")) + ": " : "";
        rows.push({ kind: c.kind, ts: m ? m.created_at : c.created_at,
          node: personRow(chatAsPerson(c), m ? who + text : "Нет сообщений", m ? shortTime(m.created_at) : "", () => chatView(c), unread.get(k)) });
      } else {
        const u = profById.get(k.slice(2));
        if (!u) continue;
        rows.push({ kind: "u", ts: m.created_at, node: personRow(u, (m.sender_id === me.id ? "Вы: " : "") + text, shortTime(m.created_at), null, unread.get(k)) });
      }
    }
    rows.sort((x, y) => (x.ts < y.ts ? 1 : -1));
    allRows = rows;
    draw();
  }

  async function loadSearch(q) {
    const my = ++seq;
    const esc = q.replace(/[,()]/g, "").replace(/[\\%_]/g, (c) => "\\" + c);
    if (!esc) { list.replaceChildren(el("p", { class: "muted" }, "Никого не найдено")); return; }
    const [pr, cr] = await Promise.all([
      sb.from("profiles").select("id, username, handle, bio, avatar_url, badge")
        .neq("id", me.id).or(`handle.ilike.%${esc}%,username.ilike.%${esc}%`).order("username").limit(50),
      sb.from("chats").select("*").or(`handle.ilike.%${esc}%,title.ilike.%${esc}%`).order("title").limit(20),
    ]);
    if (my !== seq) return;
    if (pr.error) { list.replaceChildren(el("p", { class: "muted" }, "Ошибка: " + pr.error.message)); return; }
    const out = [
      ...(cr.data || []).map((c) => personRow(chatAsPerson(c),
        (c.kind === "channel" ? "Канал" : "Группа") + (c.handle ? " · @" + c.handle : ""), "", () => openChat(c))),
      ...pr.data.map((u) => personRow(u, u.handle ? "@" + u.handle : (u.bio || "").slice(0, 60))),
    ];
    list.replaceChildren(...(out.length ? out : [el("p", { class: "muted" }, "Ничего не найдено")]));
  }

  let t;
  const run = () => {
    const q = search.value.trim().replace(/^@/, "");
    q ? loadSearch(q) : loadDialogs();
  };
  search.addEventListener("input", () => { clearTimeout(t); t = setTimeout(run, 250); });
  loadDialogs();
  refreshList = () => { if (!search.value.trim()) loadDialogs(); };
  let rt;
  channel = sb.channel("list-" + me.id)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, () => {
      if (search.value.trim()) return;
      clearTimeout(rt); rt = setTimeout(loadDialogs, 300);
    }).subscribe();
}

// --- создание группы / канала ---
async function createChatView(kind) {
  closeChannel();
  const isCh = kind === "channel";
  let avatarBlob = null, isPublic = false;
  const selected = new Set();
  let people = [];
  const err = el("p", { class: "err" });
  const nameInput = el("input", { placeholder: isCh ? "Название канала" : "Название группы", maxlength: "64" });
  const descInput = el("textarea", { rows: "2", maxlength: "255", placeholder: "Описание (необязательно)" });
  const handleInput = el("input", { placeholder: "Юзернейм, например my_channel", maxlength: "32", autocapitalize: "none", autocorrect: "off", spellcheck: "false" });
  const fileInput = el("input", { type: "file", accept: "image/*", style: "display:none" });
  const avBox = el("button", { class: "avpick", type: "button", onclick: () => fileInput.click() }, "📷");
  const createBtn = el("button", { type: "button" }, isCh ? "Создать канал" : "Создать группу");
  const peopleBox = el("div", { class: "island flush" }, el("p", { class: "muted" }, "Загрузка…"));
  const filter = el("input", { class: "search", placeholder: "🔍 Поиск по людям", autocapitalize: "none", spellcheck: "false" });
  const counter = el("span", {});

  fileInput.addEventListener("change", async () => {
    const f = fileInput.files[0];
    if (!f) return;
    try {
      avatarBlob = await resizeToSquare(f);
      avBox.replaceChildren(el("img", { src: URL.createObjectURL(avatarBlob), alt: "" }));
    } catch (e) { err.textContent = e.message; }
    fileInput.value = "";
  });

  const optPublic = el("button", { type: "button", class: "typeopt" }, el("b", {}, "Публичный"), el("small", {}, "Находится через поиск, вступить может любой"));
  const optPrivate = el("button", { type: "button", class: "typeopt on" }, el("b", {}, "Частный"), el("small", {}, "Только те, кого ты добавишь"));
  const linkBox = el("div", { class: "linkbox", style: "display:none" }, el("p", { class: "label" }, "Юзернейм (от 5 символов: a-z, цифры, _)"), handleInput);
  function setType(pub) {
    isPublic = pub;
    optPublic.classList.toggle("on", pub);
    optPrivate.classList.toggle("on", !pub);
    linkBox.style.display = pub ? "" : "none";
  }
  optPublic.addEventListener("click", () => setType(true));
  optPrivate.addEventListener("click", () => setType(false));

  function renderPeople() {
    const q = filter.value.trim().replace(/^@/, "").toLowerCase();
    const rows = people
      .filter((u) => !q || u.username.toLowerCase().includes(q) || (u.handle || "").includes(q))
      .map((u) => el("button", { class: "row" + (selected.has(u.id) ? " sel" : ""), type: "button",
        onclick: () => { selected.has(u.id) ? selected.delete(u.id) : selected.add(u.id); renderPeople(); } },
        avatar(u, "sm"),
        el("span", { class: "rowtxt" }, el("b", {}, u.username), ...(u.handle ? [el("small", {}, "@" + u.handle)] : [])),
        el("span", { class: "chk" }, selected.has(u.id) ? "✓" : "")));
    peopleBox.replaceChildren(...(rows.length ? rows : [el("p", { class: "muted" }, "Никого не найдено")]));
    counter.textContent = selected.size ? " · выбрано " + selected.size : "";
  }
  filter.addEventListener("input", renderPeople);

  createBtn.addEventListener("click", async () => {
    const title = nameInput.value.trim();
    if (!title) { err.textContent = "Введи название"; return; }
    let handle = null;
    if (isPublic) {
      handle = normHandle(handleInput.value);
      const he = handleError(handle);
      if (he) { err.textContent = "Ссылка: от 5 до 32 символов, только латиница a-z, цифры и _"; return; }
    }
    err.textContent = "";
    createBtn.disabled = true;
    try {
      let url = null;
      if (avatarBlob) {
        const path = `${me.id}/chat-${Date.now()}.jpg`;
        const { error: ue } = await sb.storage.from("avatars").upload(path, avatarBlob, { contentType: "image/jpeg" });
        if (ue) throw ue;
        url = sb.storage.from("avatars").getPublicUrl(path).data.publicUrl;
      }
      const { data, error } = await sb.rpc("create_chat", {
        p_kind: kind, p_title: title, p_description: descInput.value.trim() || null, p_avatar: url,
        p_public: isPublic, p_handle: handle, p_members: [...selected],
      });
      if (error) throw error;
      chatView(data);
    } catch (e) {
      err.textContent = e.code === "23505" ? "Эта ссылка уже занята" : e.message;
    } finally {
      createBtn.disabled = false;
    }
  });

  show(
    el("header", {}, el("button", { class: "icon", onclick: listView }, "←"), el("b", {}, isCh ? "Новый канал" : "Новая группа")),
    el("div", { class: "pscroll" },
      el("div", { class: "island pad" },
        el("div", { class: "namerow" }, avBox, nameInput), descInput),
      el("div", { class: "island pad" }, el("p", { class: "label" }, isCh ? "Тип канала" : "Тип группы"), optPrivate, optPublic, linkBox),
      el("div", { class: "island pad" }, el("p", { class: "label" }, el("span", {}, isCh ? "Подписчики" : "Участники"), counter), filter),
      peopleBox, fileInput),
    el("div", { class: "footbar" }, err, createBtn)
  );

  const { data } = await sb.from("profiles").select("id, username, handle, avatar_url, badge").neq("id", me.id).order("username").limit(200);
  people = data || [];
  renderPeople();
}

// --- карточка группы / канала ---
async function chatInfoView(chat) {
  closeChannel();
  show(el("header", { class: "bare" }, el("button", { class: "icon", onclick: listView }, "←")),
    el("div", { class: "pscroll" }, el("p", { class: "muted center" }, "Загрузка…")));
  const [mr, cr] = await Promise.all([
    sb.from("chat_members").select("user_id, role").eq("chat_id", chat.id).limit(500),
    sb.from("chats").select("*").eq("id", chat.id).single(),
  ]);
  if (cr.data) chat = cr.data;
  const members = mr.data || [];
  const ids = members.map((m) => m.user_id);
  const { data: ps } = ids.length ? await sb.from("profiles").select("id, username, handle, bio, avatar_url, badge").in("id", ids) : { data: [] };
  const byId = new Map((ps || []).map((u) => [u.id, u]));
  const mine = members.find((m) => m.user_id === me.id);
  const canLeave = mine && !chat.is_default && mine.role !== "owner";
  const isCh = chat.kind === "channel";
  const roleName = { owner: "владелец", admin: "админ" };

  const actions = el("div", { class: "actions" });
  if (mine) {
    actions.append(action("💬", "Открыть", () => chatView(chat)));
    if (canLeave) actions.append(action("🚪", "Выйти", async () => {
      if (!confirm("Выйти из «" + chat.title + "»?")) return;
      const { error } = await sb.rpc("leave_chat", { p_chat: chat.id });
      if (error) alert(error.message); else listView();
    }));
  } else {
    actions.append(action("➕", isCh ? "Подписаться" : "Вступить", async () => {
      const { error } = await sb.rpc("join_chat", { p_chat: chat.id });
      if (error) alert(error.message); else chatView(chat);
    }));
  }

  const info = el("div", { class: "island" },
    infoRow("Описание", chat.description || "Пока ничего не написано"),
    infoRow("Тип", (isCh ? "Канал" : "Группа") + (chat.is_public ? " · публичный" : " · частный")),
    infoRow("Лимит", isCh ? "до 1 000 000 подписчиков" : "до 100 000 участников"),
    chatHandleRow(chat, mine && mine.role === "owner", (c) => chatInfoView(c)),
    ...(chat.is_default ? [infoRow("Важно", "Из этого чата выйти нельзя")] : []));

  const list = el("div", { class: "island flush" }, ...members.filter((m) => byId.has(m.user_id)).map((m) => {
    const u = byId.get(m.user_id);
    return personRow(u, (roleName[m.role] || "") || (u.handle ? "@" + u.handle : ""), "",

  const saveBtn = el("button", { type: "button" }, "Сохранить");
  const cancelBtn = el("button", { class: "ghost", type: "button", onclick: profileView }, "Отмена");

  fileInput.addEventListener("change", async () => {
    const file = fileInput.files[0];
    if (!file) return;
    try {
      let blob, ext = "jpg", ctype = "image/jpeg";
      if (file.type.startsWith("video/")) {
        if (file.size > 15 * 1024 * 1024) throw new Error("Видео больше 15 МБ");
        const dur = await new Promise((res, rej) => {
          const v = document.createElement("video"); v.preload = "metadata";
          v.onloadedmetadata = () => { res(v.duration); URL.revokeObjectURL(v.src); };
          v.onerror = () => rej(new Error("Не удалось открыть видео"));
          v.src = URL.createObjectURL(file);
        });
        if (!(dur <= 10.5)) throw new Error("Видео длиннее 10 секунд");
        blob = file; ctype = file.type || "video/mp4";
        ext = ctype.includes("webm") ? "webm" : ctype.includes("quicktime") ? "mov" : "mp4";
      } else blob = await resizeToSquare(file);
      const path = `${me.id}/${Date.now()}.${ext}`;
      const { error } = await sb.storage.from("avatars").upload(path, blob, { contentType: ctype });
      if (error) throw error;
      const url = sb.storage.from("avatars").getPublicUrl(path).data.publicUrl;
      const { error: ue } = await sb.from("profiles").update({ avatar_url: url }).eq("id", me.id);
      if (ue) throw ue;
      myProfile.avatar_url = url;

    err.textContent = "";
    saveBtn.disabled = true;
    const wh = whInput.value.trim();
    if (wh && !/^24\/7$/i.test(wh) && !WH_RE.test(wh)) { err.textContent = "Часы работы: например 09:00-21:00 или 24/7"; return; }
    const patch = { username, handle: handle || null, bio: bioInput.value.trim() || null,
      location: locInput.value.trim() || null, birthday: bdInput.value || null, work_hours: wh || null,

    saveBtn.disabled = false;

    Object.assign(myProfile, patch);
    profileView();
  });

  const locInput = el("input", { value: myProfile.location || "", maxlength: "80", placeholder: "Город или страна" });
  const bdInput = el("input", { type: "date", value: myProfile.birthday || "" });

  const emInput = el("input", { value: myProfile.name_emoji || "", maxlength: "8", placeholder: "😈" });

    ...backdrops.map((b) => el("option", { value: b.id, ...(myProfile.cover === b.id ? { selected: "" } : {}) }, b.name)));
  const editBox = el("div", { class: "island pad form", style: "display:none" },
    el("p", { class: "label" }, "Ник"), nameInput,

    el("p", { class: "label" }, "Адрес"), locInput,
    el("p", { class: "label" }, "День рождения"), bdInput,
    el("p", { class: "label" }, "Часы работы (09:00-21:00 или 24/7, пусто - не показывать)"), whInput,
    el("p", { class: "label" }, "Фон вокруг аватарки"), coverSel,

  let recState = null;

  const ctxbar = el("div", { class: "ctxbar", style: "display:none" });
  const pinBar = el("div", { class: "pinbar", style: "display:none" });
  const prevText = (m) => m.body || (m.media_type === "voice" ? "Голосовое сообщение" : m.media_type === "video" ? "Видео" : m.media_type ? "Фото" : "Сообщение");
  const authorOf = (m) => m.sender_id === me.id ? "Вы" : dispName(isChat ? (profs.get(m.sender_id) || { username: "Кто-то" }) : peer);
  function setCtx(kind, m) {
    const wasEdit = !!editing;
    replyTo = kind === "reply" ? m : null; editing = kind === "edit" ? m : null;
    if (wasEdit && kind !== "edit") input.value = "";
    if (kind === "edit") input.value = m.body || "";
    if (!kind) { ctxbar.style.display = "none"; ctxbar.replaceChildren(); }
    else {

      ctxbar.replaceChildren(el("div", { class: "ctxline" }),
        el("div", { class: "ctxtxt" }, el("b", {}, kind === "edit" ? "Редактирование" : "Ответ " + authorOf(m)), el("span", {}, prevText(m))),
        el("button", { class: "icon", type: "button", onclick: () => setCtx(null) }, "✕"));
    }
    input.dispatchEvent(new Event("input"));
    if (kind) input.focus();
  }
  if (canPost) {
    const emojiBtn = svgBtn("cbtn", ICON.smile);
    const clipBtn = svgBtn("cbtn", ICON.clip);
    const giftBtn = peer.fav ? null : el("button", { class: "cbtn gift", type: "button", onclick: () => giftView(peer) }, "🎁");
    const actBtn = svgBtn("sendbtn", ICON.mic);
    const field = el("div", { class: "cfield" }, emojiBtn, input, ...(giftBtn ? [giftBtn] : []), clipBtn, actBtn);
    const bar = el("form", { class: "composer tg" }, field);
    const panel = el("div", { class: "emojipanel", style: "display:none" });
    composer = el("div", { class: "cwrap" }, status, ctxbar, bar, panel);

    const galleryInput = el("input", { type: "file", accept: "image/*,video/*", style: "display:none" });
    const camInput = el("input", { type: "file", accept: "image/*", capture: "environment", style: "display:none" });
    const vidInput = el("input", { type: "file", accept: "video/*", capture: "environment", style: "display:none" });
    composer.append(galleryInput, camInput, vidInput);
    [galleryInput, camInput, vidInput].forEach((inp) => inp.addEventListener("change", () => {
      const f = inp.files[0]; inp.value = ""; if (f) previewAndSend(f);
    }));

    // кнопка справа: микрофон, а если есть текст - отправить
    const refreshAct = () => { setIcon(actBtn, input.value.trim() ? ICON.send : ICON.mic); actBtn.classList.toggle("mic", !input.value.trim()); };
    actBtn.classList.add("mic");
    input.addEventListener("input", refreshAct);

    // смайлики
    let tabKey = Object.keys(EMOJI)[0];
    function renderPanel() {
      panel.replaceChildren(
        el("div", { class: "etabs" }, ...Object.keys(EMOJI).map((k) =>
          el("button", { class: "etab" + (k === tabKey ? " on" : ""), type: "button", onclick: () => { tabKey = k; renderPanel(); } }, k))),
        el("div", { class: "egrid" }, ...EMOJI[tabKey].split(" ").map((e) =>
          el("button", { class: "eb", type: "button", onclick: () => {
            const a = input.selectionStart ?? input.value.length, z = input.selectionEnd ?? a;
            input.setRangeText(e, a, z, "end");
            refreshAct();
          } }, e))));
    }
    function togglePanel(open) {
      const show = open ?? panel.style.display === "none";
      panel.style.display = show ? "" : "none";
      setIcon(emojiBtn, show ? "⌨️" : ICON.smile);
      if (show) { renderPanel(); input.blur(); } else input.focus();
    }
    emojiBtn.addEventListener("click", () => togglePanel());
    input.addEventListener("focus", () => { if (panel.style.display !== "none") togglePanel(false); });

    // прикрепить
    clipBtn.addEventListener("click", () => {
      const close = () => back.remove();
      const item = (icon, title, sub2, fn) => el("button", { class: "mitem", type: "button", onclick: () => { close(); fn(); } },
        el("span", { class: "mi" }, icon), el("span", {}, el("b", {}, title), el("small", {}, sub2)));
      const back = el("div", { class: "backdrop", onclick: (e) => { if (e.target === back) close(); } },
        el("div", { class: "sheet attach" },
          item("🖼", "Галерея", "Фото и видео из памяти телефона", () => galleryInput.click()),
          item("📷", "Сделать снимок", "Открыть камеру", () => camInput.click()),
          item("🎥", "Записать видео", "Открыть камеру для видео", () => vidInput.click()),
          ...(isChat ? [] : [item("🎁", "Подарок", "Отправить подарок за звёзды", () => giftView(peer))])));
      document.body.append(back);
    });

    // запись голоса: нажми на микрофон, затем на стрелку - отправить, на корзину - отмена
    const recTimer = el("span", { class: "rectime" }, "0:00");
    const trash = svgBtn("cbtn trash", ICON.trash, { onclick: () => stopRec(false) });
    const recUI = el("div", { class: "cfield rec" }, trash, el("span", { class: "recdot" }), recTimer,
      el("span", { class: "rechint" }, "идёт запись…"));
    async function startRec() {
      if (!navigator.mediaDevices || !window.MediaRecorder) { alert("Запись голоса не поддерживается в этом браузере"); return; }
      let stream;
      try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
      catch { alert("Нет доступа к микрофону. Разреши его для этого сайта в настройках браузера."); return; }
      const mime = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"].find((t) => MediaRecorder.isTypeSupported(t));
      const mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
      const chunks = [];
      mr.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      recState = { mr, chunks, stream, start: Date.now(), mime: mr.mimeType || mime || "audio/webm" };
      recState.timer = setInterval(() => { recTimer.textContent = fmtDur((Date.now() - recState.start) / 1000); }, 250);
      mr.start(250);
      recTimer.textContent = "0:00";
      setIcon(actBtn, ICON.send);
      bar.replaceChildren(recUI, actBtn);
    }
    function stopRec(send) {
      if (!recState) return;
      const r = recState; recState = null;
      clearInterval(r.timer);
      const secs = Math.round((Date.now() - r.start) / 1000);
      r.mr.onstop = async () => {
        r.stream.getTracks().forEach((t) => t.stop());
        if (!send) return;
        if (secs < 1) { toast("Слишком короткое сообщение"); return; }
        const type = (r.mr.mimeType || r.mime).split(";")[0];
        const ext = type.includes("mp4") ? "m4a" : type.includes("ogg") ? "ogg" : "webm";
        await sendMedia(new Blob(r.chunks, { type }), "voice", ext, type, secs, "");
      };
      try { r.mr.stop(); } catch { r.stream.getTracks().forEach((t) => t.stop()); }
      field.append(actBtn);
      bar.replaceChildren(field);
      refreshAct();
    }
    actBtn.addEventListener("click", (e) => {
      e.preventDefault();
      if (recState) { stopRec(true); return; }
      if (input.value.trim()) { sendText(); return; }
      startRec();
    });
    bar.addEventListener("submit", (e) => { e.preventDefault(); if (!recState && input.value.trim()) sendText(); });
    chatCleanup = () => { if (recState) stopRec(false); if (playingAudio) playingAudio.pause(); };
  } else {
    composer = el("div", { class: "readonly" }, "Писать в канале могут только администраторы");
  }

  // предпросмотр фото/видео с подписью перед отправкой
  function previewAndSend(file) {
    const isVideo = file.type.startsWith("video/");
    if (!isVideo && !file.type.startsWith("image/")) { alert("Можно отправлять только фото и видео"); return; }
    if (file.size > 50 * 1024 * 1024) { alert("Файл слишком большой (максимум 50 МБ)"); return; }
    const url = URL.createObjectURL(file);
    const cap = el("input", { placeholder: "Добавить подпись…", maxlength: "1000" });
    const close = () => { back.remove(); URL.revokeObjectURL(url); };
    const go = svgBtn("sendbtn", ICON.send, { onclick: async () => {
      const caption = cap.value.trim();
      close();
      try {
        if (isVideo) await sendMedia(file, "video", (file.name.split(".").pop() || "mp4").toLowerCase(), file.type || "video/mp4", null, caption);
        else await sendMedia(await resizeImage(file), "image", "jpg", "image/jpeg", null, caption);
      } catch (e) { alert("Не отправилось: " + e.message); }
    } });
    const back = el("div", { class: "pv" },
      el("button", { class: "icon pvx", onclick: close }, "✕"),
      el("div", { class: "pvm" }, isVideo ? el("video", { src: url, controls: "", playsinline: "" }) : el("img", { src: url, alt: "" })),
      el("div", { class: "pvbar" }, el("div", { class: "cfield" }, cap), go));
    document.body.append(back);
  }

  async function sendMedia(blob, kind, ext, contentType, duration, caption) {
    status.style.display = ""; status.textContent = kind === "voice" ? "Отправка голосового…" : "Отправка…";
    try {
      const path = `${me.id}/${(crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(36).slice(2))}.${ext}`;
      const { error: ue } = await sb.storage.from("media").upload(path, blob, { contentType });
      if (ue) throw ue;
      const url = sb.storage.from("media").getPublicUrl(path).data.publicUrl;
      const row = { body: caption || "", media_url: url, media_type: kind, media_duration: duration,
        ...(replyTo ? { reply_to: replyTo.id } : {}),
        ...(isChat ? { chat_id: peer.id } : { recipient_id: peer.id }) };
      const { data: r, error } = await sb.from("messages").insert(row).select().single();
      if (error) throw error;
      add(r); if (replyTo) setCtx(null);
    } catch (e) {
      alert("Не отправилось: " + (/row-level security/.test(e.message) ? "аккаунт ограничен или в этот чат нельзя писать" : e.message));
    } finally { status.style.display = "none"; }
  }

  async function sendText() {
    const text = input.value.trim();
    if (!text) return;
    if (editing) {
      const m = editing;
      const { error: ee } = await sb.rpc("edit_message", { p_id: m.id, p_body: text });
      if (ee) { alert("Не удалось изменить: " + ee.message + " (выполнена ли часть 19 SQL?)"); return; }
      m.body = text; m.edited_at = new Date().toISOString();
      setCtx(null); refreshNode(m); updatePinBar();
      return;
    }
    const rt = replyTo;
    input.value = "";
    input.dispatchEvent(new Event("input"));
    const { data: row, error: err } = await sb.from("messages")
      .insert({ ...(isChat ? { chat_id: peer.id } : { recipient_id: peer.id }), body: text, ...(rt ? { reply_to: rt.id } : {}) }).select().single();
    if (!err && rt) setCtx(null);
    if (err) { input.value = text; input.dispatchEvent(new Event("input")); alert(/row-level security/.test(err.message) ? "Не отправилось: аккаунт ограничен или в этот чат нельзя писать" : "Не отправилось: " + err.message); }
    else add(row);
  }
  const sub = el("small", {});
  const head = el("button", { class: "peerhead", type: "button",
    onclick: () => (isChat ? chatInfoView(peer) : peer.fav ? profileView() : peerProfileView(peer)) },
    avatar(isChat ? chatAsPerson(peer) : peer, "sm"),
    isChat ? el("span", {}, el("span", { class: "ptitle" }, peer.title), sub) : el("span", {}, nameWithBadge(peer, 16)));
  show(el("header", {}, el("button", { class: "icon", onclick: listView }, "←"), head), pinBar, box, composer);
  if (isChat) {
    sb.from("chat_members").select("user_id", { count: "exact", head: true }).eq("chat_id", peer.id)
      .then(({ count }) => { if (count != null) sub.textContent = membersText(peer, count); });
  }

  // имена авторов в группах
  const profs = new Map([[me.id, myProfile]]);
  async function ensureProfiles(ids) {
    const need = [...new Set(ids)].filter((id) => id && !profs.has(id));
    if (!need.length) return;
    const { data } = await sb.from("profiles").select("id, username, handle, avatar_url, badge").in("id", need);
    (data || []).forEach((u) => profs.set(u.id, u));
  }
  const colors = ["#ff7b8a", "#ffb35c", "#7bd88f", "#5cc8ff", "#b496ff", "#ff8fd0"];
  const colorOf = (id) => colors[[...id].reduce((a, c) => a + c.charCodeAt(0), 0) % colors.length];

  const seen = new Set();
  let prev = null; // последнее сообщение: для разделителей дней и группировки
  function dayLabel(d) {
    const o = { day: "numeric", month: "long" };
    if (d.getFullYear() !== new Date().getFullYear()) o.year = "numeric";
    return d.toLocaleDateString("ru-RU", o);
  }
  function add(m) {
    if (seen.has(m.id)) return;
    seen.add(m.id);
    const d = new Date(m.created_at);
    const time = d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
    const day = d.toDateString();
    if (!prev || prev.day !== day) box.append(el("div", { class: "daysep" }, dayLabel(d)));
    if (m.gift_id) {
      // подарок: системная "плашка" сверху и прозрачная карточка с подарком, как в Телеграме
      const g = giftById[m.gift_id] || { emoji: "🎁", name: "Подарок", price: 0 };
      const mineG = m.sender_id === me.id;
      const cost = plural(g.price, ["звезды", "звезды", "звёзд"]);
      const selfG = mineG && m.recipient_id === me.id;
      const toChatG = !!m.chat_id;
      const gSender = mineG ? myProfile : (profs.get(m.sender_id) || { username: "Кто-то" });
      const island = el("div", { class: "sysisland" },
        toChatG ? (mineG ? "Вы" : dispName(gSender)) + " отправил" + (mineG ? "и" : "") + " подарок чату стоимостью " + cost :
        selfG ? "Вы отправили себе подарок стоимостью " + cost : mineG ? "Вы отправили подарок стоимостью " + cost : dispName(peer) + " отправил вам подарок стоимостью " + cost);
      const card = el("div", { class: "giftcard" },
        el("div", { class: "gcemoji" }, giftArt(g)),
        el("div", { class: "gctitle" }, ...(toChatG ? [el("span", {}, "Подарок для"), avatar(chatAsPerson(peer), "sm"), el("b", {}, peer.title), el("span", {}, "от"), nameWithBadge(gSender, 15)] : selfG ? [el("span", {}, "Подарок себе")] : [el("span", {}, mineG ? "Подарок для" : "Подарок от"), avatar(peer, "sm"), nameWithBadge(peer, 15)])),
        ...(m.body && m.body !== "Подарок" ? [el("div", { class: "gccomment" }, m.body)] : []),
        el("div", { class: "gcsub" }, toChatG ? "Подарок отправлен в чат." : mineG && !selfG ? "Подарок появится в профиле получателя." : "Этот подарок виден в вашем профиле."),
        el("button", { class: "gcbtn", type: "button", onclick: async () => {
          let gq = sb.from("gifts").select("*").eq("sender_id", m.sender_id);
          gq = m.chat_id ? gq.eq("chat_id", m.chat_id) : gq.eq("recipient_id", m.recipient_id);
          const { data: row } = await gq.eq("gift_id", m.gift_id).eq("created_at", m.created_at).maybeSingle();
          const info = row || { id: null, gift_id: m.gift_id, price: g.price, created_at: m.created_at, hidden: false, sender_id: m.sender_id };
          giftSheet(info, toChatG ? gSender : mineG ? myProfile : peer, (!mineG || selfG) && !toChatG && !!row, () => {});
        } }, "Посмотреть"));
      box.append(island, card);
      prev = { day, sender: "__gift", node: card };
      box.scrollTop = box.scrollHeight;
      return;
    }
    const sameGroup = prev && prev.day === day && prev.sender === m.sender_id;
    if (sameGroup) prev.node.classList.remove("tail");
    const cls = "msg tail " + (m.sender_id === me.id ? "mine" : "theirs") + (m.media_type === "voice" ? " voice" : m.media_type ? " media" : "") + (sameGroup ? "" : " first");
    const node = el("div", { class: cls });
    node._same = sameGroup;
    msgs.set(m.id, m); nodes.set(m.id, node);
    node.replaceChildren(...bodyOf(m, sameGroup));
    wireMenu(node, m);
    box.append(node);
    prev = { day, sender: m.sender_id, node };
    box.scrollTop = box.scrollHeight;
    if (m.pinned_at) updatePinBar();
  }

  function bodyOf(m, sameGroup) {
    const out = [];
    const time = new Date(m.created_at).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
    if (isChat && peer.kind === "group" && m.sender_id !== me.id && !sameGroup) {
      const u = profs.get(m.sender_id);
      out.push(el("span", { class: "sname", style: "color:" + colorOf(m.sender_id) }, u ? nameWithBadge(u, 14) : "…"));
    }
    if (m.fwd_name) out.push(el("span", { class: "fwd" }, "Переслано от ", el("b", {}, m.fwd_name)));
    if (m.reply_to) {
      const r = msgs.get(m.reply_to);
      out.push(el("div", { class: "rquote", onclick: (e) => { e.stopPropagation(); jumpTo(m.reply_to); } },
        el("b", {}, r ? authorOf(r) : "Сообщение"), el("span", {}, r ? prevText(r) : "недоступно")));
    }
    if (m.media_type) {
      out.push(mediaNode(m));
      if (m.body) out.push(el("span", { class: "mcap" }, m.body));
    } else {
      const gm = GIFT_LINK_RE.exec(m.body || "");
      out.push(gm ? el("button", { class: "giftlink", type: "button", onclick: () => openGiftLink(gm[1]) }, "🎁 NFT-подарок · открыть") : el("span", {}, m.body));
    }
    const rc = {};
    Object.values(m.reactions || {}).forEach((e) => { rc[e] = (rc[e] || 0) + 1; });
    const mine = (m.reactions || {})[me.id];
    if (Object.keys(rc).length) out.push(el("div", { class: "reacts" }, ...Object.entries(rc).map(([e, n]) =>
      el("button", { class: "rchip" + (mine === e ? " on" : ""), type: "button", onclick: (ev) => { ev.stopPropagation(); react(m, e); } }, e + (n > 1 ? " " + n : "")))));
    out.push(el("span", { class: "mt" }, ...(m.pinned_at ? [el("i", { class: "mpin" }, "📌")] : []), ...(m.edited_at ? [el("i", { class: "med" }, "изменено")] : []), time));
    return out;
  }
  function refreshNode(m) { const n = nodes.get(m.id); if (n) n.replaceChildren(...bodyOf(m, n._same)); }
  function jumpTo(id) {
    const n = nodes.get(id); if (!n) { toast("Сообщение не загружено"); return; }
    n.scrollIntoView({ block: "center", behavior: "smooth" });
    n.classList.add("flash"); setTimeout(() => n.classList.remove("flash"), 1400);
  }
  function updatePinBar() {
    const p = [...msgs.values()].filter((x) => x.pinned_at).sort((a, b) => (a.pinned_at < b.pinned_at ? 1 : -1))[0];
    if (!p) { pinBar.style.display = "none"; pinBar.replaceChildren(); return; }
    pinBar.style.display = "";
    pinBar.replaceChildren(el("div", { class: "pbline" }),
      el("div", { class: "pbtxt", onclick: () => jumpTo(p.id) }, el("b", {}, "Закреплённое сообщение"), el("span", {}, prevText(p))),
      el("button", { class: "icon", type: "button", onclick: () => pin(p, false) }, "✕"));
  }
  async function pin(m, on) {
    const { error } = await sb.rpc("pin_message", { p_id: m.id, p_pin: on });
    if (error) { toast(error.message.includes("function") ? "Запусти gifts_part19.sql" : error.message); return; }
    if (on) msgs.forEach((x) => { if (x.pinned_at) { x.pinned_at = null; refreshNode(x); } });
    m.pinned_at = on ? new Date().toISOString() : null;
    refreshNode(m); updatePinBar(); toast(on ? "Сообщение закреплено" : "Сообщение откреплено");
  }
  async function react(m, e) {
    const { error } = await sb.rpc("react_message", { p_id: m.id, p_emoji: e });
    if (error) { toast(error.message.includes("function") ? "Запусти gifts_part19.sql" : error.message); return; }
    const r = { ...(m.reactions || {}) };
    if (r[me.id] === e) delete r[me.id]; else r[me.id] = e;
    m.reactions = r; refreshNode(m);
  }
  function copyText(t) {
    const done = () => toast("Скопировано");
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, () => fallbackCopy(t, done));
    else fallbackCopy(t, done);
  }
  function fallbackCopy(t, done) {
    const ta = el("textarea", { style: "position:fixed;opacity:0" }); ta.value = t; document.body.append(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch { toast("Не удалось скопировать"); }
    ta.remove();
  }
  async function delMsg(m) {
    if (!confirm("Удалить сообщение?")) return;
    const { error } = await sb.rpc("delete_message", { p_id: m.id });
    if (error) { toast(error.message.includes("function") ? "Запусти gifts_part19.sql" : error.message); return; }
    dropMsg(m.id);
  }
  function dropMsg(id) { const n = nodes.get(id); if (n) n.remove(); nodes.delete(id); msgs.delete(id); updatePinBar(); }

  // меню при нажатии на сообщение
  function wireMenu(node, m) {
    let timer = null, moved = false;
    node.addEventListener("touchstart", () => { moved = false; timer = setTimeout(() => { if (!moved) { node._lp = true; openMenu(node, m); } }, 450); }, { passive: true });
    node.addEventListener("touchmove", () => { moved = true; clearTimeout(timer); }, { passive: true });
    node.addEventListener("touchend", () => clearTimeout(timer));
    node.addEventListener("contextmenu", (e) => { e.preventDefault(); openMenu(node, m); });
    node.addEventListener("click", (e) => {
      if (node._lp) { node._lp = false; return; }
      if (e.target.closest("button,a,video,audio,img,input")) return;
      openMenu(node, m);
    });
  }
  function openMenu(node, m) {
    document.querySelectorAll(".mmback").forEach((x) => x.remove());
    const own = m.sender_id === me.id;
    const close = () => back.remove();
    const item = (svg, label, fn, cls) => el("button", { class: "mmitem" + (cls ? " " + cls : ""), type: "button", onclick: () => { close(); fn(); } },
      (() => { const i = el("span", { class: "mmi" }); i.innerHTML = svg; return i; })(), el("span", {}, label));
    const myR = (m.reactions || {})[me.id];
    const bar = el("div", { class: "mmreact" }, ...["❤️", "👍", "👎", "🔥", "🥰", "👏", "😁"].map((e) =>
      el("button", { class: "mmr" + (myR === e ? " on" : ""), type: "button", onclick: () => { close(); react(m, e); } }, e)));
    const I = (d) => '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
    const items = [
      ...(canPost ? [item(I('<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v3"/>'), "Ответить", () => setCtx("reply", m))] : []),
      ...(m.body && !GIFT_LINK_RE.test(m.body) ? [item(I('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>'), "Копировать", () => copyText(m.body))] : []),
      item(I('<path d="m15 4 5 5-5 5"/><path d="M20 9H10a6 6 0 0 0-6 6v3"/>'), "Переслать", () => forwardView(m)),
      item(I('<path d="M12 17v5M8 3h8l-1 7 3 3v2H6v-2l3-3z"/>'), m.pinned_at ? "Открепить" : "Закрепить", () => pin(m, !m.pinned_at)),
      ...(own && m.body && canPost && !GIFT_LINK_RE.test(m.body) ? [item(I('<path d="M4 20h4L19 9l-4-4L4 16z"/>'), "Изменить", () => setCtx("edit", m))] : []),
      ...(own ? [item(I('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'), "Удалить", () => delMsg(m), "danger")] : []),
    ];
    const menu = el("div", { class: "mmenu" }, ...items);
    const wrap = el("div", { class: "mmwrap" }, bar, menu);
    const back = el("div", { class: "mmback", onclick: (e) => { if (e.target === back) close(); } }, wrap);
    document.body.append(back);
    const r = node.getBoundingClientRect(), vw = innerWidth, vh = innerHeight;
    const mw = wrap.offsetWidth, mh = wrap.offsetHeight;
    let left = own ? r.right - mw : r.left; left = Math.max(8, Math.min(left, vw - mw - 8));
    let top = r.bottom + 8; if (top + mh > vh - 8) top = Math.max(8, r.top - mh - 8);
    if (top + mh > vh - 8) top = Math.max(8, vh - mh - 8);
    wrap.style.left = left + "px"; wrap.style.top = top + "px";
  }

  // переслать: выбор контактов
  async function forwardView(m) {
    const picked = new Set();
    const list = el("div", { class: "island flush" }, el("p", { class: "muted" }, "Загрузка…"));
    const go = el("button", { class: "okbtn", type: "button", disabled: "" }, "Выберите получателей");
    const rows = [];
    const refreshGo = () => { go.disabled = !picked.size; go.textContent = picked.size ? "Переслать (" + picked.size + ")" : "Выберите получателей"; };
    show(el("header", {}, el("button", { class: "icon", onclick: () => chatView(peer) }, "←"), el("b", {}, "Переслать")),
      el("div", { class: "pscroll" }, list), el("div", { class: "fwdbar" }, go));
    const ids = [...contacts.keys()];
    let people = [];
    if (ids.length) { const { data } = await sb.from("profiles").select("id, username, handle, avatar_url, badge").in("id", ids); people = data || []; }
    people.sort((a, b) => dispName(a).localeCompare(dispName(b), "ru"));
    const all = [{ id: me.id, username: "Избранное", fav: true }, ...people];
    list.replaceChildren(...all.map((u) => {
      const row = personRow(u, u.fav ? "Только вы" : u.handle ? "@" + u.handle : "", "", () => {
        if (picked.has(u.id)) picked.delete(u.id); else picked.add(u.id);
        row.classList.toggle("sel", picked.has(u.id)); refreshGo();
      });
      return row;
    }));
    if (!people.length) list.append(el("p", { class: "muted" }, "Контактов пока нет — можно переслать в «Избранное»"));
    go.addEventListener("click", async () => {
      go.disabled = true;
      const author = m.fwd_name || authorOf(m);
      let ok = 0, fail = null;
      for (const id of picked) {
        const { error } = await sb.from("messages").insert({ recipient_id: id, body: m.body || "", fwd_name: author,
          ...(m.media_type ? { media_url: m.media_url, media_type: m.media_type, media_duration: m.media_duration } : {}) });
        if (error) fail = error; else ok++;
      }
      if (fail && !ok) { alert("Не переслалось: " + fail.message + " (выполнена ли часть 19 SQL?)"); go.disabled = false; return; }
      toast(ok > 1 ? "Переслано: " + ok : "Сообщение переслано");
      chatView(peer);
    });
  }

  // история (последние 200)
  const q = sb.from("messages").select("*");
  const { data, error } = await (isChat
    ? q.eq("chat_id", peer.id)
    : q.or(`and(sender_id.eq.${me.id},recipient_id.eq.${peer.id}),and(sender_id.eq.${peer.id},recipient_id.eq.${me.id})`)
  ).order("created_at", { ascending: false }).limit(200);
  if (error) { box.append(el("p", { class: "muted" }, "Ошибка: " + error.message)); return; }
  if (isChat) await ensureProfiles(data.map((m) => m.sender_id));
  data.reverse().forEach(add);
  const readKey = (isChat ? "c:" : "u:") + peer.id;
  loadLocalRead();
  const markRead = () => {
    saveLocalRead(readKey, Date.now() + 60000);
    sb.rpc("mark_read", { p_key: readKey }).then(({ error }) => {
      if (error && !markRead.warned) { markRead.warned = true; toast("Отметка о прочтении не сохраняется на сервере (запусти gifts_part5.sql)"); }
    }, () => {});
  };
  markRead();
  // дошёл до конца переписки (увидел новые) - отметка; при выходе из чата тоже
  box.addEventListener("scroll", () => { if (box.scrollTop + box.clientHeight >= box.scrollHeight - 80) markRead(); });
  const prevCleanup = chatCleanup;
  chatCleanup = () => { markRead(); if (prevCleanup) prevCleanup(); };

  // новые сообщения в реальном времени
  channel = sb.channel("chat-" + me.id + "-" + peer.id)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, async (p) => {
      const m = p.new;
      const ok = isChat
        ? m.chat_id === peer.id
        : (m.sender_id === peer.id && m.recipient_id === me.id) || (m.sender_id === me.id && m.recipient_id === peer.id);
      if (!ok) return;
      if (isChat) await ensureProfiles([m.sender_id]);
      add(m);
      if (m.sender_id !== me.id) markRead();
    })
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "messages" }, (p) => {
      const cur = msgs.get(p.new.id); if (!cur) return;
      Object.assign(cur, p.new); refreshNode(cur); updatePinBar();
    })
    .on("postgres_changes", { event: "DELETE", schema: "public", table: "messages" }, (p) => { if (p.old && p.old.id) dropMsg(p.old.id); })
    .subscribe();

  if (canPost) input.focus();
}

// --- запуск: показываем нужный экран по состоянию входа ---
let currentUid;
sb.auth.onAuthStateChange((_event, session) => {
  const uid = session?.user?.id ?? null;
  if (uid === currentUid) return; // обновление токена не должно сбрасывать экран
  currentUid = uid;
  me = session?.user ?? null;
  if (!uid) { myProfile = null; authView(); return; }
  setTimeout(async () => { await loadMyProfile(); if (isRestricted(myProfile)) { lockedView(); return; } await Promise.all([loadWalletAndCatalog(), loadContacts()]); listView();
    const gid = new URLSearchParams(location.search).get("gift");
    if (gid) { history.replaceState(null, "", location.pathname); openGiftLink(gid); } }, 0);
});

// вернулись в приложение (из фона/после перезапуска) - обновить список чатов
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && refreshList) refreshList(); });
window.addEventListener("focus", () => { if (refreshList) refreshList(); });
window.addEventListener("pageshow", () => { if (refreshList) refreshList(); });

// режим приложения: регистрируем service worker (нужен для установки на телефон)
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
