<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1015">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="icon-192.png?v=2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SmartGram</title>
<style>
  :root{--bg:#06070a;--panel:#0e1015;--line:#1a1d24;--text:#e8eaf0;--muted:#8b91a0;--accent:#4c8dff;--mine:#2b5fd9;--theirs:#1a1d26}
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  input,textarea,[contenteditable=true]{-webkit-user-select:text;user-select:text}
  html{touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%}
  img,svg,video{-webkit-user-drag:none;user-drag:none}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,sans-serif}
  #app{height:100dvh;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  header b{flex:1;font-size:18px}
  button{font:inherit;border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:#fff;cursor:pointer}
  button:disabled{opacity:.6}
  button.icon{background:none;padding:4px 8px;font-size:22px;color:var(--text)}
  button.ghost{background:none;color:var(--muted);padding:6px 8px}
  button.danger{background:none;color:#ff6b6b}
  input,textarea{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
  textarea{resize:vertical}
  .auth{padding:24px 16px;display:flex;flex-direction:column;gap:12px;margin:auto 0}
  .auth h1{margin:0 0 8px}
  .err{color:#ff6b6b;min-height:1.4em;margin:0}
  .muted{color:var(--muted);padding:16px;margin:0}
  .tabbar{display:flex;background:var(--panel);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border-radius:12px;padding:6px 0;color:var(--muted);font-size:12px}
  .tab .ti{font-size:22px;line-height:26px;height:26px;display:flex;align-items:center}
  .tab .avatar{width:26px;height:26px;font-size:12px}
  .tab.on{color:var(--accent)}
  header.bare{background:none;border-bottom:0;position:absolute;left:0;top:0;z-index:2}
  #app{position:relative}
  .pscroll{flex:1;overflow:auto;padding-bottom:16px}
  .pscroll .center{display:flex;justify-content:center;padding:8px 0}
  .hero{display:flex;flex-direction:column;align-items:center;gap:4px;padding:28px 16px 8px;background:linear-gradient(180deg,#1c2a4d 0%,transparent 100%)}
  .hero .avatar{box-shadow:0 0 0 4px rgba(76,141,255,.25)}
  .hero h2{margin:10px 0 0;font-size:24px;overflow-wrap:anywhere;text-align:center}
  .hero .sub{color:var(--muted);font-size:14px}
  .actions{display:flex;gap:10px;padding:12px 16px 4px}
  .act{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--panel);color:var(--text);border-radius:16px;padding:12px 4px;font-size:13px}
  .act .ai{font-size:22px;line-height:26px}
  .island{background:var(--panel);border-radius:18px;margin:12px 16px 0;padding:2px 16px}
  .island.pad{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .irow{display:block;width:100%;text-align:left;background:none;border-radius:0;color:var(--text);padding:12px 0;border-bottom:1px solid var(--line)}
  .irow:last-child{border-bottom:0}
  .irow .iv{font-size:16px;overflow-wrap:anywhere;white-space:pre-wrap}
  .irow .il{color:var(--muted);font-size:13px;margin-top:2px}
  .pill{display:inline-block;margin:12px 0 6px;padding:6px 14px;border-radius:999px;background:rgba(76,141,255,.18);color:var(--accent);font-weight:600;font-size:14px}
  .island.gifts{padding-bottom:12px}
  .island.gifts .muted{padding:8px 0}
  .ptabs{display:flex;gap:4px;margin:16px 16px 0;padding:5px;background:var(--panel);border-radius:999px;overflow-x:auto;scrollbar-width:none}
  .ptabs::-webkit-scrollbar{display:none}
  .ptab{flex:none;background:none;color:var(--muted);border-radius:999px;padding:8px 16px;font-weight:600;font-size:15px}
  .ptab.on{background:rgba(76,141,255,.2);color:var(--accent)}
  .pbody{padding:12px 16px 0}
  .stubmini{text-align:center;color:var(--muted);padding:36px 0}
  .stubmini b{display:block;font-size:18px;color:var(--text);margin-bottom:4px}
  .chips{display:flex;gap:8px;margin-bottom:12px}
  .chip{padding:8px 16px;border-radius:999px;background:var(--panel);font-weight:600}
  .sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}
  .stile{position:relative;aspect-ratio:9/16;background:#111;border-radius:6px;overflow:hidden;padding:0;display:block}
  .stile img,.stile video{width:100%;height:100%;object-fit:cover;display:block}
  .stile small{position:absolute;left:6px;bottom:5px;color:#fff;font-size:11px;text-shadow:0 1px 3px #000}
  .toprow{display:flex;align-items:center;gap:10px;padding:10px 16px}
  .toprow .rk{width:26px;text-align:center;font-weight:700;color:var(--muted)}
  .toprow .nm{flex:1;min-width:0}.toprow .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .toprow input{width:96px;padding:8px;border-radius:10px;text-align:right}
  .toprow .amt{font-weight:700;white-space:nowrap}
  .ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .gcard{position:relative;aspect-ratio:1;background:var(--panel);border-radius:18px;padding:0;display:grid;place-items:center;color:var(--text)}
  .gcard.dim .gbig{opacity:.35}
  .gbig{font-size:68px;line-height:1}
  .gsender{position:absolute;left:8px;top:8px}
  .gcard .gsender .avatar.sm{width:24px;height:24px;font-size:11px}
  .ghid{position:absolute;bottom:8px;font-size:12px;color:var(--muted)}
  .hint{color:var(--muted);text-align:center;font-size:14px;margin:16px 8px 0}
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
  .sheet{width:100%;max-width:640px;background:#202228;border-radius:24px 24px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom));text-align:center;max-height:92dvh;overflow:auto}
  .sheetemoji{font-size:128px;line-height:1.1;margin-top:8px}
  .sheet h2{margin:8px 0 4px;font-size:24px}
  .sheetsub{color:var(--text);margin:0 0 16px}
  .gtable{border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left}
  .gtable>div{display:flex;align-items:center;border-bottom:1px solid var(--line)}
  .gtable>div:last-child{border-bottom:0}
  .gtable>div>span{flex:none;width:34%;padding:14px 12px;font-weight:700;background:rgba(255,255,255,.04);align-self:stretch;display:flex;align-items:center}
  .gtable>div>div{padding:10px 12px;display:flex;align-items:center;gap:8px;flex:1;min-width:0}
  .gtable .from{flex-wrap:wrap}
  .gtable .from .avatar.sm{width:28px;height:28px;font-size:13px}
  .gtable .from b{max-width:100%;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tagbtn{background:rgba(76,141,255,.2);color:var(--accent);border-radius:999px;padding:4px 10px;font-size:13px;flex:none}
  .sheetnote{color:var(--muted);font-size:14px;margin:14px 0}
  .linkbtn{background:none;color:var(--accent);padding:0;font-size:14px}
  .sendg{width:auto;padding:14px 28px}
  .okbtn{width:100%;border-radius:999px;padding:14px;font-weight:700;margin-top:6px}
  .fab{position:absolute;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;padding:0;font-size:24px;box-shadow:0 6px 18px rgba(43,95,217,.55);z-index:5}
  .backdrop.clear{background:transparent;align-items:flex-end;justify-content:flex-end}
  .fabmenu{margin:0 16px calc(156px + env(safe-area-inset-bottom)) 0;background:#23262e;border-radius:18px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);min-width:250px}
  .mitem{display:flex;align-items:center;gap:12px;width:100%;background:none;color:var(--text);text-align:left;padding:10px 12px;border-radius:12px}
  .mitem:active{background:rgba(255,255,255,.07)}
  .mitem .mi{font-size:24px}
  .mitem b{display:block;font-weight:600}
  .mitem small{display:block;color:var(--muted);font-size:13px}
  .sname{display:block;font-weight:600;font-size:14px;margin-bottom:1px}
  .readonly{padding:16px;text-align:center;color:var(--muted);background:var(--panel);border-top:1px solid var(--line);padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .ptitle{display:block;font-weight:600;line-height:1.2}
  .peerhead small{display:block;font-weight:400;color:var(--muted);font-size:13px;line-height:1.2}
  .namerow{display:flex;gap:12px;align-items:center}
  .avpick{flex:none;width:56px;height:56px;border-radius:50%;padding:0;font-size:24px;background:rgba(76,141,255,.2);overflow:hidden}
  .avpick img{width:100%;height:100%;object-fit:cover;display:block}
  .typeopt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.04);color:var(--text);border:2px solid transparent;border-radius:14px;padding:10px 14px}
  .typeopt.on{border-color:var(--accent)}
  .typeopt b{display:block}
  .typeopt small{color:var(--muted)}
  .linkbox{display:flex;flex-direction:column;gap:6px}
  .island.flush{padding:0;overflow:hidden}
  .island.flush .row:last-child{border-bottom:0}
  .row.sel{background:rgba(76,141,255,.12)}
  .chk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:#fff;line-height:1}
  .row.sel .chk{background:var(--accent);border-color:var(--accent)}
  .footbar{padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
  .footbar .err{min-height:0}
  .nm{display:inline-flex;align-items:center;gap:0;max-width:100%}
  .badge{display:inline-block;flex:none;margin-left:.45em;vertical-align:middle;cursor:pointer;line-height:0}
  .badge.bl{margin-left:0;margin-right:.45em}
  .verif{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin:10px 20px 0}
  .toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2b2f39;color:var(--text);padding:12px 18px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:80;max-width:86vw;text-align:center;font-size:15px}
  .duo{display:flex;gap:10px}
  .duo button{flex:1}
  button.warn{background:#c0392b}
  select.sel{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
  .stub{flex:1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:24px}
  .stub b{display:block;font-size:20px;color:var(--text);margin-bottom:4px}
  .ok{color:#4cd08a;min-height:1.4em;margin:0}
  .searchbox{padding:8px 16px;border-bottom:1px solid var(--line)}
  .label{color:var(--muted);font-size:13px;margin:4px 0 -6px}
  .list{flex:0 1 auto;min-height:0;overflow:auto;margin:12px 16px;border-radius:18px}
  .list .row:last-child{border-bottom:0}
  .tabbar{margin-top:auto}
  .row{display:flex;align-items:center;gap:12px;width:100%;background:none;border-radius:0;border-bottom:1px solid var(--line);padding:12px 16px;text-align:left;color:var(--text)}
  .row small{display:block;color:var(--muted);font-size:13px}
  .rowtxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .rowtop{display:flex;align-items:baseline;gap:8px}
  .rowtop b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .rowtop small{flex:none}
  .rowsub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .brand{font-size:22px}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:600;flex:none;overflow:hidden;color:#fff}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .avatar.sm{width:36px;height:36px;font-size:15px}
  .avatar.big{width:112px;height:112px;font-size:46px}
  .avbtn{background:none;padding:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--accent);font-size:14px}
  .peerhead{display:flex;align-items:center;gap:10px;background:none;padding:0;color:var(--text);font-weight:600;flex:1;text-align:left;font-size:18px}
  .profile{flex:1;overflow:auto;padding:24px 16px;display:flex;flex-direction:column;gap:12px}
  .profile .center{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
  .profile h2{margin:0}
  .bio{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}
  .msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:3px}
  .msg{max-width:82%;padding:7px 12px 6px;border-radius:18px;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.3}
  .msg.first{margin-top:6px}
  .msg .mt{float:right;margin:7px 0 -3px 12px;font-size:12px;line-height:1;opacity:.6;white-space:nowrap}
  .msg.gift .mt{float:none;display:block;text-align:right;margin:4px 0 -2px}
  .daysep{align-self:center;margin:10px 0 6px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.09);color:var(--text);font-size:13px;font-weight:500}
  .mine{align-self:flex-end;background:var(--mine)}
  .theirs{align-self:flex-start;background:var(--theirs)}
  .mine.tail{border-bottom-right-radius:5px}
  .theirs.tail{border-bottom-left-radius:5px}
  .composer{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
  .composer .gbtn{background:none;padding:0 6px;font-size:24px}
  .msg.gift{text-align:center;min-width:150px}
  .msg.gift .gemoji{font-size:56px;line-height:1.15;display:block}
  .msg.gift .gname{font-weight:600;display:block}
  .msg.gift .gcomment{display:block;margin-top:2px;opacity:.9}
  .stars{color:#ffc94d;font-weight:600}
  .balance{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--panel);border-radius:12px}
  .gifts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .gtile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:14px;background:var(--panel);border:2px solid transparent;color:var(--text)}
  .gtile.sel{border-color:var(--accent)}
  .gtile .gemoji{font-size:40px;line-height:1.15}
  .gtile .stars{font-size:14px}
  .owned{display:flex;flex-wrap:wrap;gap:8px}
  .owned span{font-size:30px;background:var(--panel);border-radius:12px;padding:6px 10px}

  .composer.tg{align-items:flex-end;gap:8px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:transparent;border-top:0}
  .cwrap{background:var(--bg)}
  .cfield{flex:1;display:flex;align-items:center;background:var(--panel);border-radius:24px;padding:0 6px;min-height:48px;min-width:0}
  .cfield input{border:0;background:transparent;padding:12px 4px;border-radius:0;outline:0}
  .cbtn{background:none;color:var(--muted);padding:6px;border-radius:50%;display:grid;place-items:center;font-size:22px;line-height:1;flex:none}
  .cbtn.gift{font-size:21px;filter:grayscale(1) brightness(1.4)}
  .cbtn.trash{color:#ff6b6b}
  .sendbtn{flex:none;width:48px;height:48px;border-radius:50%;padding:0;display:grid;place-items:center;background:var(--accent);color:#fff}
  .cfield.rec{gap:10px;padding-right:14px}
  .recdot{width:10px;height:10px;border-radius:50%;background:#ff4d4d;animation:blink 1s infinite}
  .rectime{font-variant-numeric:tabular-nums}
  .rechint{color:var(--muted);font-size:14px;margin-left:auto}
  @keyframes blink{50%{opacity:.25}}
  .sending{padding:6px 16px;color:var(--muted);font-size:13px;text-align:center}
  .emojipanel{height:270px;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column}
  .etabs{display:flex;border-bottom:1px solid var(--line)}
  .etab{flex:1;background:none;padding:8px 0;font-size:22px;border-radius:0;border-bottom:2px solid transparent}
  .etab.on{border-bottom-color:var(--accent)}
  .egrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(8,1fr);align-content:start;padding:6px}
  .eb{background:none;padding:4px 0;font-size:26px;line-height:1.3;border-radius:8px}
  .eb:active{background:rgba(255,255,255,.1)}
  .sheet.attach{padding-top:10px;text-align:left}
  .msg.media{padding:4px 4px 6px}
  .msg.media .mcap{display:block;padding:4px 8px 0}
  .msg.media .mt{margin-right:6px}
  .chatimg{display:block;max-width:100%;max-height:340px;border-radius:14px;background:#000}
  video.chatimg{width:100%}
  .viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:90;display:grid;place-items:center}
  .viewer img{max-width:100%;max-height:100%;object-fit:contain}
  .pv{position:fixed;inset:0;background:#000;z-index:70;display:flex;flex-direction:column}
  .pvx{position:absolute;left:8px;top:8px;color:#fff;z-index:2}
  .pvm{flex:1;display:grid;place-items:center;min-height:0}
  .pvm img,.pvm video{max-width:100%;max-height:100%}
  .pvbar{display:flex;gap:8px;align-items:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#111}
  .msg.voice{min-width:230px}
  .voice{display:flex;align-items:center;gap:10px;padding:2px 0}
  .vplay{flex:none;width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center;background:var(--accent);color:#fff}
  .mine .vplay{background:#fff;color:var(--mine)}
  .vbody{flex:1;min-width:0}
  .wave{display:flex;align-items:center;gap:2px;height:26px;cursor:pointer}
  .wave i{flex:1;min-width:2px;border-radius:2px;background:rgba(255,255,255,.35)}
  .theirs .wave i{background:rgba(139,145,160,.55)}
  .wave i.on{background:#fff}
  .theirs .wave i.on{background:var(--accent)}
  .vdur{font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}
  .sysisland{align-self:center;margin:12px 0 6px;padding:7px 16px;border-radius:999px;background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:14px;font-weight:500;text-align:center;max-width:92%}
  .giftcard{align-self:center;width:min(290px,86%);margin:2px 0 10px;padding:14px 14px 16px;border-radius:22px;background:rgba(255,255,255,.07);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.06);text-align:center}
  .gcemoji{font-size:116px;line-height:1.1}
  .gctitle{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;margin-top:6px;flex-wrap:wrap}
  .gctitle .avatar.sm{width:22px;height:22px;font-size:11px}
  .gccomment{margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}
  .gcsub{color:var(--muted);font-size:14px;margin:6px 4px 12px}
  .gcbtn{background:rgba(255,255,255,.12);color:var(--text);border-radius:999px;padding:9px 26px;font-weight:600}
  header.bare{right:0;justify-content:space-between}
  .backdrop.clear.top{align-items:flex-start}
  .popmenu{margin:58px 12px 0 0;background:#23262e;border-radius:18px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.5);min-width:250px}
  .mitem.danger b{color:#ff6b6b}
  .nft{background:linear-gradient(90deg,#ff3b5c,#ff9a3c,#ff3b8f,#ff3b5c);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:shine 3s linear infinite;font-weight:600}

// обрезаем фото до квадрата и уменьшаем, чтобы загрузка была быстрой
function resizeToSquare(file, size = 256) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(img.width, img.height);
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = size;
      canvas.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url);
      canvas.toBlob((b) => (b ? resolve(b) : reject(new Error("Не удалось обработать фото"))), "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Не удалось открыть изображение")); };
    img.src = url;
  });
}

let playingAudio = null;
function voiceNode(m) {
  const N = 32;
  let seed = [...String(m.id)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const bars = Array.from({ length: N }, () => el("i", { style: `height:${6 + Math.round(rnd() * 18)}px` }));
  const wave = el("div", { class: "wave" }, ...bars);
  const btn = svgBtn("vplay", ICON.play);
  const total = m.media_duration || 0;
  const dur = el("span", { class: "vdur" }, fmtDur(total));
  const audio = new Audio(m.media_url);
  audio.preload = "none";
  const paint = () => {
    const t = total || (isFinite(audio.duration) ? audio.duration : 0);
    const k = t ? audio.currentTime / t : 0;
    bars.forEach((b, i) => b.classList.toggle("on", i < Math.round(k * N)));
    dur.textContent = fmtDur(audio.paused && audio.currentTime === 0 ? t : audio.currentTime);
  };
  audio.addEventListener("timeupdate", paint);
  audio.addEventListener("ended", () => { audio.currentTime = 0; setIcon(btn, ICON.play); bars.forEach((b) => b.classList.remove("on")); dur.textContent = fmtDur(total); });
  audio.addEventListener("pause", () => setIcon(btn, ICON.play));
  audio.addEventListener("play", () => setIcon(btn, ICON.pause));
  btn.addEventListener("click", () => {
    if (audio.paused) {
      if (playingAudio && playingAudio !== audio) playingAudio.pause();
      playingAudio = audio;
      audio.play().catch(() => alert("Не удалось воспроизвести"));
    } else audio.pause();
  });
  wave.addEventListener("click", (e) => {
    const r = wave.getBoundingClientRect();
    const t = total || (isFinite(audio.duration) ? audio.duration : 0);
    if (t) { audio.currentTime = ((e.clientX - r.left) / r.width) * t; paint(); }
  });
  return el("div", { class: "voice" }, btn, el("div", { class: "vbody" }, wave, dur));
}

let toastTimer;
function toast(text) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const t = el("div", { class: "toast" }, text);
  document.body.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2600);
}

function badgeIcon(type, size = 17) {
  const b = BADGES[type];
  if (!b) return null;
  const n = el("span", { class: "badge" + (b.left ? " bl" : ""), style: `color:${b.color};width:${size}px;height:${size}px`, role: "img", "aria-label": b.title });
  n.innerHTML = type === "support" ? SUPPORT_SEAL : SEAL; // константы, не пользовательский текст
  n.addEventListener("click", (e) => { e.stopPropagation(); toast(b.title); });
  return n;
}

const MONTHS = ["янв.", "февр.", "мар.", "апр.", "мая", "июня", "июля", "авг.", "сент.", "окт.", "нояб.", "дек."];
function fmtBirthday(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const now = new Date();
  let age = now.getFullYear() - y;
  if (now.getMonth() + 1 < m || (now.getMonth() + 1 === m && now.getDate() < d)) age--;
  return d + " " + MONTHS[m - 1] + " " + y + " (" + plural(age, ["год", "года", "лет"]) + ")";

const WH_RE = /^(\d{1,2}):(\d{2})\s*[-–]\s*(\d{1,2}):(\d{2})$/;
function workStatus(wh) {
  if (!wh) return null;
  if (/^24\/7$/i.test(wh.trim())) return { text: "Открыто 24/7", open: true, hours: "Часы работы" };
  const m = WH_RE.exec(wh.trim());

}

const nftCls = (h) => "nft" + (h && h.length <= 3 ? " nft3" : "");
const HANDLE_RE = /^[a-z0-9_]{5,32}$/;
const HANDLE_DOMAIN = "@smartgram.app"; // служебный адрес: пользователю email не нужен
const normHandle = (v) => v.trim().replace(/^@/, "").toLowerCase();
const handleError = (h) => HANDLE_RE.test(h) ? null :
  "Юзернейм: от 5 до 32 символов, только латиница a-z, цифры и _";

// --- экран входа / регистрации ---
function authView() {
  closeChannel();
  let signup = false;
  const err = el("p", { class: "err" });
  const name = el("input", { placeholder: "Ник (как тебя видят друзья)", maxlength: "30", autocomplete: "nickname" });
  const login = el("input", { placeholder: "Юзернейм", autocapitalize: "none", autocorrect: "off", spellcheck: "false", autocomplete: "username" });
  const pass = el("input", { type: "password", placeholder: "Пароль (от 6 символов)", autocomplete: "current-password" });
  const pass2 = el("input", { type: "password", placeholder: "Повтори пароль", autocomplete: "new-password" });
  const btn = el("button", {});
  const toggle = el("button", { class: "ghost", type: "button" });

  function render() {
    name.style.display = signup ? "" : "none";
    pass2.style.display = signup ? "" : "none";
    login.placeholder = signup ? "Юзернейм (от 5 символов, a-z 0-9 _)" : "Юзернейм (или email)";
    btn.textContent = signup ? "Зарегистрироваться" : "Войти";
    toggle.textContent = signup ? "Уже есть аккаунт? Войти" : "Нет аккаунта? Регистрация";
    err.textContent = "";
  }
  toggle.addEventListener("click", () => { signup = !signup; render(); });

  btn.addEventListener("click", async () => {
    err.textContent = "";
    btn.disabled = true;
    try {
      if (signup) {
        const nick = name.value.trim();
        const handle = normHandle(login.value);
        if (nick.length < 2) throw new Error("Ник должен быть от 2 символов");
        const he = handleError(handle);
        if (he) throw new Error(he);
        if (pass.value.length < 6) throw new Error("Пароль должен быть от 6 символов");
        if (pass.value !== pass2.value) throw new Error("Пароли не совпадают");
        const { data: free, error: ce } = await sb.rpc("handle_available", { h: handle });
        if (ce) throw ce;
        if (!free) throw new Error("Этот юзернейм уже занят");
        const { data, error } = await sb.auth.signUp({
          email: handle + HANDLE_DOMAIN,
          password: pass.value,
          options: { data: { username: nick, handle } },
        });
        if (error) throw error;
        if (!data.session) throw new Error("Не удалось войти сразу после регистрации. Попробуй войти.");
      } else {
        const v = login.value.trim();
        const email = v.includes("@") && !v.startsWith("@") ? v : normHandle(v) + HANDLE_DOMAIN;
        const { error } = await sb.auth.signInWithPassword({ email, password: pass.value });
        if (error) throw new Error(error.message === "Invalid login credentials" ? "Неверный юзернейм или пароль" : error.message);
      }
    } catch (e) {
      err.textContent = e.message;
    } finally {
      btn.disabled = false;
    }
  });

  show(el("div", { class: "auth" }, el("h1", {}, APP_NAME), name, login, pass, pass2, err, btn, toggle));
  render();
}

async function loadStories() {
  const { data, error } = await sb.rpc("active_stories");
  if (error) return [];
  const g = new Map();
  for (const r of data || []) {
    if (!g.has(r.user_id)) g.set(r.user_id, { user: { id: r.user_id, username: r.username, avatar_url: r.avatar_url }, items: [] });
    g.get(r.user_id).items.push(r);
  }
  return [...g.values()].sort((a, b) => (b.user.id === me.id) - (a.user.id === me.id) ||
    (a.items.every((i) => i.seen) ? 1 : 0) - (b.items.every((i) => i.seen) ? 1 : 0));

      raf = requestAnimationFrame(tick);
    }
    media.replaceChildren(m, left, right, ...(it.caption ? [el("div", { class: "scap" }, it.caption)] : []));
    if (!it.seen && g.user.id !== me.id) { it.seen = true; sb.from("story_views").insert({ story_id: it.id, viewer_id: me.id }).then(() => {}); }
  }
  let x0 = 0, y0 = 0;
  root.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  root.addEventListener("touchend", (e) => {
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (dy > 90 && Math.abs(dy) > Math.abs(dx)) close();
    else if (dx < -70 && Math.abs(dx) > Math.abs(dy)) { if (gi < groups.length - 1) { gi++; si = 0; play(); } else close(); }
    else if (dx > 70 && Math.abs(dx) > Math.abs(dy)) { if (gi > 0) { gi--; si = 0; play(); } }
  }, { passive: true });
  play();
}

async function listView() {
  closeChannel();
  loadLocalRead();
  const list = el("div", { class: "list" }, el("p", { class: "muted" }, "Загрузка…"));
  const search = el("input", { class: "search", placeholder: "🔍 Поиск по @юзернейму или нику", autocapitalize: "none", spellcheck: "false" });
  const fab = el("button", { class: "fab", type: "button", onclick: createMenu, "aria-label": "Создать" }, "✏️");
  let folder = "all", allRows = [];
  const ftabs = el("div", { class: "ptabs ftabs" });
  const FOLDERS = [["all", "Все чаты"], ["u", "Личные"], ["group", "Группы"], ["channel", "Каналы"]];
  function draw() {
    ftabs.replaceChildren(...FOLDERS.map(([id, label]) => el("button", { class: "ptab" + (folder === id ? " on" : ""), type: "button",
      onclick: () => { folder = id; draw(); } }, label)));
    const rows = allRows.filter((r) => folder === "all" || r.kind === folder);
    list.replaceChildren(...(rows.length ? rows.map((r) => r.node) : [el("p", { class: "muted center" }, allRows.length ? "В этой папке пока пусто" : "Чатов пока нет")]));
  }
  show(el("header", {}, el("b", { class: "brand" }, APP_NAME)),
    storiesBar(), el("div", { class: "searchbox" }, search), ftabs, list, tabBar("chats"), fab);
  draw();

  let seq = 0;
  async function loadDialogs() {
    const my = ++seq;
    const [mr, cm, rd] = await Promise.all([
      sb.from("messages").select("sender_id, recipient_id, chat_id, body, gift_id, media_type, created_at")
        .order("created_at", { ascending: false }).limit(500),
      sb.from("chat_members").select("chat_id").eq("user_id", me.id),
      sb.from("chat_reads").select("key, last_read").eq("user_id", me.id),
    ]);
    if (my !== seq) return;
    if (mr.error) { list.replaceChildren(el("p", { class: "muted" }, "Ошибка: " + mr.error.message)); return; }
    const last = new Map(), unread = new Map();
    const reads = new Map((rd.data || []).map((r) => [r.key, r.last_read]));
    for (const m of mr.data) {
      const key = m.chat_id ? "c:" + m.chat_id : "u:" + (m.sender_id === me.id ? m.recipient_id : m.sender_id);
      if (!last.has(key)) last.set(key, m);
      const seenMs = Math.max(reads.has(key) ? Date.parse(reads.get(key)) : 0, localRead.get(key) || 0);
      if (m.sender_id !== me.id && Date.parse(m.created_at) > seenMs) unread.set(key, (unread.get(key) || 0) + 1);
    }
    const favKey = "u:" + me.id;
    if (!last.has(favKey)) last.set(favKey, null);
    for (const r of cm.data || []) if (!last.has("c:" + r.chat_id)) last.set("c:" + r.chat_id, null);
    if (!last.size) {
      list.replaceChildren(el("p", { class: "muted" }, "Чатов пока нет. Найди друга через поиск по @юзернейму или нажми ✏️, чтобы создать группу."));
      return;
    }
    const chatIds = [], userIds = new Set();
    for (const [k, m] of last) {
      if (k[0] === "c") { chatIds.push(k.slice(2)); if (m && m.sender_id !== me.id) userIds.add(m.sender_id); }
      else userIds.add(k.slice(2));
    }
    const [cr, pr] = await Promise.all([
      chatIds.length ? sb.from("chats").select("*").in("id", chatIds) : { data: [] },
      userIds.size ? sb.from("profiles").select("id, username, handle, bio, avatar_url, badge").in("id", [...userIds]) : { data: [] },
    ]);
    if (my !== seq) return;
    const chatById = new Map((cr.data || []).map((c) => [c.id, c]));
    const profById = new Map((pr.data || []).map((u) => [u.id, u]));
    const rows = [];
    for (const [k, m] of last) {
      const text = m ? (m.gift_id ? "🎁 Подарок" : m.media_type ? mediaLabel(m) : m.body) : "";
      if (k === favKey) {
        rows.push({ kind: "u", ts: m ? m.created_at : "", node: personRow(FAV(), m ? text : "Сохраняйте здесь сообщения и подарки", m ? shortTime(m.created_at) : "") });
        continue;
      }
      if (k[0] === "c") {
        const c = chatById.get(k.slice(2));
        if (!c) continue;
        const who = m && c.kind === "group" ? (m.sender_id === me.id ? "Вы" : (profById.get(m.sender_id)?.username || "?")) + ": " : "";
        rows.push({ kind: c.kind, ts: m ? m.created_at : c.created_at,
          node: personRow(chatAsPerson(c), m ? who + text : "Нет сообщений", m ? shortTime(m.created_at) : "", () => chatView(c), unread.get(k)) });
      } else {
        const u = profById.get(k.slice(2));
        if (!u) continue;
        rows.push({ kind: "u", ts: m.created_at, node: personRow(u, (m.sender_id === me.id ? "Вы: " : "") + text, shortTime(m.created_at), null, unread.get(k)) });
      }
    }
    rows.sort((x, y) => (x.ts < y.ts ? 1 : -1));
    allRows = rows;
    draw();
  }

  async function loadSearch(q) {
    const my = ++seq;
    const esc = q.replace(/[,()]/g, "").replace(/[\\%_]/g, (c) => "\\" + c);
    if (!esc) { list.replaceChildren(el("p", { class: "muted" }, "Никого не найдено")); return; }
    const [pr, cr] = await Promise.all([
      sb.from("profiles").select("id, username, handle, bio, avatar_url, badge")
        .neq("id", me.id).or(`handle.ilike.%${esc}%,username.ilike.%${esc}%`).order("username").limit(50),
      sb.from("chats").select("*").or(`handle.ilike.%${esc}%,title.ilike.%${esc}%`).order("title").limit(20),
    ]);
    if (my !== seq) return;
    if (pr.error) { list.replaceChildren(el("p", { class: "muted" }, "Ошибка: " + pr.error.message)); return; }
    const out = [
      ...(cr.data || []).map((c) => personRow(chatAsPerson(c),
        (c.kind === "channel" ? "Канал" : "Группа") + (c.handle ? " · @" + c.handle : ""), "", () => openChat(c))),
      ...pr.data.map((u) => personRow(u, u.handle ? "@" + u.handle : (u.bio || "").slice(0, 60))),
    ];
    list.replaceChildren(...(out.length ? out : [el("p", { class: "muted" }, "Ничего не найдено")]));
  }

  let t;
  const run = () => {
    const q = search.value.trim().replace(/^@/, "");
    q ? loadSearch(q) : loadDialogs();
  };
  search.addEventListener("input", () => { clearTimeout(t); t = setTimeout(run, 250); });
  loadDialogs();
  refreshList = () => { if (!search.value.trim()) loadDialogs(); };
  let rt;
  channel = sb.channel("list-" + me.id)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, () => {
      if (search.value.trim()) return;
      clearTimeout(rt); rt = setTimeout(loadDialogs, 300);
    }).subscribe();
}

async function chatInfoView(chat) {

  show(el("header", { class: "bare" }, el("button", { class: "icon", onclick: listView }, "←")),
    el("div", { class: "pscroll" }, el("p", { class: "muted center" }, "Загрузка…")));

  const byId = new Map((ps || []).map((u) => [u.id, u]));

    ...(chat.is_default ? [infoRow("Важно", "Из этого чата выйти нельзя")] : []));

  const list = el("div", { class: "island flush" }, ...members.filter((m) => byId.has(m.user_id)).map((m) => {

// --- мой профиль (редактирование) ---
function profileView() {
  closeChannel();
  const err = el("p", { class: "err" });
  const nameInput = el("input", { value: myProfile.username, maxlength: "30", placeholder: "Ник" });
  const handleInput = el("input", { value: myProfile.handle || "", maxlength: "32", placeholder: "Юзернейм, например ivan_2024", autocapitalize: "none", autocorrect: "off", spellcheck: "false" });
  const bioInput = el("textarea", { rows: "3", maxlength: "200", placeholder: "Расскажи о себе" }, myProfile.bio || "");
  const fileInput = el("input", { type: "file", accept: "image/*,video/*", style: "display:none" });
  const saveBtn = el("button", { type: "button" }, "Сохранить");
  const cancelBtn = el("button", { class: "ghost", type: "button", onclick: profileView }, "Отмена");

  fileInput.addEventListener("change", async () => {
    const file = fileInput.files[0];
    if (!file) return;
    try {
      let blob, ext = "jpg", ctype = "image/jpeg";
      if (file.type.startsWith("video/")) {
        if (file.size > 15 * 1024 * 1024) throw new Error("Видео больше 15 МБ");
        const dur = await new Promise((res, rej) => {
          const v = document.createElement("video"); v.preload = "metadata";
          v.onloadedmetadata = () => { res(v.duration); URL.revokeObjectURL(v.src); };
          v.onerror = () => rej(new Error("Не удалось открыть видео"));
          v.src = URL.createObjectURL(file);
        });
        if (!(dur <= 10.5)) throw new Error("Видео длиннее 10 секунд");
        blob = file; ctype = file.type || "video/mp4";
        ext = ctype.includes("webm") ? "webm" : ctype.includes("quicktime") ? "mov" : "mp4";
      } else blob = await resizeToSquare(file);
      const path = `${me.id}/${Date.now()}.${ext}`;
      const { error } = await sb.storage.from("avatars").upload(path, blob, { contentType: ctype });
      if (error) throw error;
      const url = sb.storage.from("avatars").getPublicUrl(path).data.publicUrl;
      const { error: ue } = await sb.from("profiles").update({ avatar_url: url }).eq("id", me.id);
      if (ue) throw ue;
      myProfile.avatar_url = url;
      profileView();
    } catch (e) {
      alert("Не удалось загрузить: " + e.message + (/mime|size|exceed/i.test(e.message) ? " (выполнена ли часть 7 SQL?)" : ""));
    } finally {
      fileInput.value = "";
    }
  });

  saveBtn.addEventListener("click", async () => {
    const username = nameInput.value.trim();
    if (username.length < 2) { err.textContent = "Ник должен быть от 2 символов"; return; }
    const handle = normHandle(handleInput.value);
    if (!handle && myProfile.handle) { err.textContent = "Юзернейм нельзя убрать"; return; }
    if (handle && handle !== myProfile.handle) { const he = handleError(handle); if (he) { err.textContent = he; return; } }
    err.textContent = "";
    saveBtn.disabled = true;
    const wh = whInput.value.trim();
    if (wh && !/^24\/7$/i.test(wh) && !WH_RE.test(wh)) { err.textContent = "Часы работы: например 09:00-21:00 или 24/7"; return; }
    const patch = { username, handle: handle || null, bio: bioInput.value.trim() || null,
      location: locInput.value.trim() || null, birthday: bdInput.value || null, work_hours: wh || null,
      name_emoji: emInput.value.trim() || null, cover: coverSel.value || null };
    const { error } = await sb.from("profiles").update(patch).eq("id", me.id);
    saveBtn.disabled = false;
    if (error) { err.textContent = error.code === "23505" ? "Этот юзернейм уже занят" : error.message; return; }
    Object.assign(myProfile, patch);
    profileView();
  });

  const locInput = el("input", { value: myProfile.location || "", maxlength: "80", placeholder: "Город или страна" });
  const bdInput = el("input", { type: "date", value: myProfile.birthday || "" });
  const whInput = el("input", { value: myProfile.work_hours || "", maxlength: "20", placeholder: "09:00-21:00 или 24/7", autocapitalize: "none" });
  const emInput = el("input", { value: myProfile.name_emoji || "", maxlength: "8", placeholder: "😈" });
  const coverSel = el("select", { class: "sel" }, el("option", { value: "" }, "Без фона"),
    ...backdrops.map((b) => el("option", { value: b.id, ...(myProfile.cover === b.id ? { selected: "" } : {}) }, b.name)));
  const editBox = el("div", { class: "island pad form", style: "display:none" },
    el("p", { class: "label" }, "Ник"), nameInput,
    el("p", { class: "label" }, "Смайлик рядом с ником"), emInput,
    el("p", { class: "label" }, "Адрес"), locInput,
    el("p", { class: "label" }, "День рождения"), bdInput,
    el("p", { class: "label" }, "Часы работы (09:00-21:00 или 24/7, пусто - не показывать)"), whInput,
    el("p", { class: "label" }, "Фон вокруг аватарки"), coverSel,
    el("p", { class: "label" }, "Юзернейм (по нему тебя находят, от 5 символов)"), handleInput,
    el("p", { class: "label" }, "О себе"), bioInput,
    err, saveBtn, cancelBtn);

  const info = el("div", { class: "island" },
    infoRow("О себе", myProfile.bio || "Пока ничего не написано"),
    ...phoneRow(myProfile, true),
    usernameRow(myProfile, true, () => edit()),
    ...locRows(myProfile),
    ...profileExtraRows(myProfile),
    ...(me.email && !me.email.endsWith(HANDLE_DOMAIN) ? [infoRow("Email", me.email)] : []));

  const edit = () => { info.style.display = "none"; editBox.style.display = ""; actions.style.display = "none"; };
  const actions = el("div", { class: "actions" },
    action("📷", "Фото или видео", () => fileInput.click()),
    action("✏️", "Изменить", edit),
    action("⚙️", "Настройки", settingsView));

    const mime = ["video/webm;codecs=vp8,opus", "video/webm", "video/mp4"].find((t) => MediaRecorder.isTypeSupported(t));

sb.auth.onAuthStateChange((_event, session) => {
  const uid = session?.user?.id ?? null;
  if (uid === currentUid) return; // обновление токена не должно сбрасывать экран
  currentUid = uid;
  me = session?.user ?? null;
  if (!uid) { myProfile = null; authView(); return; }
  setTimeout(async () => { await loadMyProfile(); if (isRestricted(myProfile)) { lockedView(); return; } await Promise.all([loadWalletAndCatalog(), loadContacts()]); listView(); ageModal();
    const gid = new URLSearchParams(location.search).get("gift");
    if (gid) { history.replaceState(null, "", location.pathname); openGiftLink(gid); } }, 0);
});

// вернулись в приложение (из фона/после перезапуска) - обновить список чатов
// окно «Сколько тебе лет?» — один раз, чисто для прикола, ни на что не влияет и не проверяется
function ageModal() {
  if (LS.get("sg_age", null) !== null) return;
  const inp = el("input", { type: "number", inputmode: "numeric", placeholder: "Например, 18", style: "text-align:center;font-size:22px" });
  const go = el("button", { class: "okbtn", type: "button", onclick: () => { LS.set("sg_age", inp.value || "-"); back.remove(); } }, "Продолжить");
  const back = el("div", { class: "backdrop" }, el("div", { class: "sheet" },
    el("h2", {}, "Сколько тебе лет?"), inp, el("p", { class: "sheetsub" }, "Мы не будем это проверять 🙂"), go));
  document.body.append(back);
}
// автообновление: если на сервере версия новее — перезагружаем страницу (важно для APK)
async function checkUpdate() {
  try {
    const r = await fetch(location.pathname + "?_=" + Date.now(), { cache: "no-store" });
    const m = /const BUILD = (\d+)/.exec(await r.text());
    if (m && +m[1] > BUILD) {
      const k = "sg_reload_" + m[1];
      if (!sessionStorage.getItem(k)) { sessionStorage.setItem(k, "1"); location.replace(location.pathname + "?v=" + m[1]); }
    }
  } catch {}
}
setTimeout(checkUpdate, 1500);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { checkUpdate(); if (refreshList) refreshList(); } });
window.addEventListener("focus", () => { if (refreshList) refreshList(); });
window.addEventListener("pageshow", () => { if (refreshList) refreshList(); });

// режим приложения: регистрируем service worker (нужен для установки на телефон)
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
